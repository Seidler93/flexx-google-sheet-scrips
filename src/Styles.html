<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --panel-border: #dfe5ed;
    --text: #17202a;
    --muted: #667085;
    --sidebar: #000000;
    --sidebar-soft: #333333;
    --accent: #2a6ab4;
    --accent-dark: #1f5594;
    --danger: #b42318;
    --shadow: 0 16px 45px rgba(16, 24, 32, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  .app-shell {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    min-height: 100vh;
    margin: 0;
  }

  .sidebar {
    background: var(--sidebar);
    color: #ffffff;
    padding: 24px 18px;
  }

  .brand {
    display: block;
    margin-bottom: 18px;
  }

  .brand-logo {
    display: block;
    width: 118px;
    height: auto;
    margin: 0 auto;
    border-radius: 8px;
    background: #ffffff;
    padding: 7px;
  }

  .field-label {
    color: #aab6c4;
    font-size: 12px;
  }

  .field-label {
    display: block;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .select,
  .input,
  .textarea {
    width: 100%;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: #ffffff;
    color: var(--text);
    padding: 10px 12px;
  }

  .sidebar .select {
    background: var(--sidebar-soft);
    color: #ffffff;
    border-color: #4b5563;
  }

  .nav-list {
    display: grid;
    gap: 6px;
    margin-top: 28px;
  }

  .nav-item {
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #d7dde6;
    cursor: pointer;
    padding: 11px 12px;
    text-align: left;
  }

  .nav-item.active,
  .nav-item:hover:not(:disabled) {
    background: var(--sidebar-soft);
    color: #ffffff;
  }

  .nav-item:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }

  .content {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
    padding: 20px 24px 24px;
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) minmax(280px, 430px) minmax(120px, 1fr);
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .topbar-search {
    position: relative;
    width: 100%;
  }

  .topbar-tools {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 40px;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .global-search-input {
    height: 40px;
  }

  .add-member-button {
    width: 40px;
    height: 40px;
    border: 1px solid var(--accent-dark);
    background: var(--accent);
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    box-shadow: 0 0 0 2px rgba(47, 105, 178, 0.16);
  }

  .add-member-button:hover:not(:disabled) {
    border-color: #1f4f8b;
    background: var(--accent-dark);
    box-shadow: 0 0 0 3px rgba(47, 105, 178, 0.22);
  }

  .global-search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 40;
    max-height: 360px;
    overflow: auto;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: #ffffff;
    box-shadow: var(--shadow);
  }

  .global-search-message {
    color: var(--muted);
    font-size: 14px;
    padding: 12px 14px;
  }

  .global-search-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--panel-border);
    background: transparent;
    color: inherit;
    cursor: pointer;
    padding: 11px 12px;
    text-align: left;
  }

  .global-search-item:hover,
  .global-search-item:focus {
    background: #f7fafc;
    outline: none;
  }

  .global-search-item:last-child {
    border-bottom: 0;
  }

  .global-search-primary,
  .global-search-secondary {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .global-search-primary {
    flex-direction: column;
    align-items: flex-start;
  }

  .global-search-secondary {
    flex-shrink: 0;
  }

  .search-source-pill {
    border-radius: 999px;
    background: #eef2f7;
    color: #475467;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 8px;
    white-space: nowrap;
  }

  h1,
  h2,
  p {
    margin: 0;
  }

  h1 {
    font-size: 24px;
    line-height: 1.2;
  }

  h2 {
    font-size: 18px;
  }

  #locationLabel {
    color: var(--muted);
    margin-top: 4px;
  }

  .status-text {
    justify-self: end;
    min-height: 36px;
    max-width: min(420px, 100%);
    margin-right: -24px;
    padding: 9px 24px 9px 14px;
    border: 1px solid #c9d7e8;
    border-right: 0;
    border-radius: 8px 0 0 8px;
    background: #eef5ff;
    color: #21456f;
    font-size: 14px;
    line-height: 1.2;
    text-align: right;
    box-shadow: 0 8px 20px rgba(20, 43, 72, 0.08);
  }

  .status-text:empty {
    min-height: 0;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .status-text.error {
    border-color: #efc4bd;
    background: #fff0ee;
    color: var(--danger);
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
  }

  #cancellationsView.active {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }

  .metric-card,
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .metric-card {
    padding: 12px 14px;
  }

  .metric-card span {
    color: var(--muted);
    display: block;
    font-size: 13px;
  }

  .metric-card strong {
    display: block;
    font-size: 28px;
    line-height: 1.15;
    margin-top: 4px;
  }

  .panel {
    overflow: hidden;
  }

  .cancellations-panel {
    display: flex;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    width: 100%;
  }

  .cancellations-panel .table-wrap {
    flex: 1;
    max-height: none;
    min-height: 0;
  }

  .panel-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    padding: 12px 14px;
  }

  .panel-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }

  .secondary-button {
    background: #eef4f5;
    color: var(--accent-dark);
  }

  .secondary-button:hover:not(:disabled) {
    background: #dfecee;
  }

  .danger-button {
    background: var(--danger);
    color: #ffffff;
  }

  .danger-button:hover:not(:disabled) {
    background: #912018;
  }

  .column-menu {
    position: relative;
  }

  .column-menu-popover {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    width: 240px;
    max-height: 360px;
    overflow: auto;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: #ffffff;
    box-shadow: var(--shadow);
    padding: 8px;
  }

  .column-option {
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 6px;
    cursor: pointer;
    padding: 8px;
    color: var(--text);
    font-size: 14px;
  }

  .column-option:hover {
    background: #f3f6f8;
  }

  .table-wrap {
    max-height: 70vh;
    overflow: auto;
  }

  .member-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .member-table th,
  .member-table td {
    border-bottom: 1px solid var(--panel-border);
    border-right: 1px solid var(--panel-border);
    max-width: 260px;
    padding: 7px 10px;
    text-align: left;
    vertical-align: middle;
  }

  .member-table td[data-label="Notes"],
  .member-table td[data-label="Reason"],
  .member-table td[data-label="Reason/Solution"],
  .member-table td[data-label="Solution"] {
    text-align: left;
    vertical-align: top;
  }

  .member-table th:last-child,
  .member-table td:last-child {
    border-right: 0;
  }

  .member-table th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #eaf2fb;
    color: #1f5594;
    font-weight: 700;
    white-space: nowrap;
  }

  .table-sort-button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    padding: 0;
    text-align: left;
  }

  .sort-indicator {
    color: var(--accent-dark);
    font-size: 13px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    padding: 5px 9px;
    white-space: nowrap;
  }

  .status-active {
    background: #dbeafe;
    color: #1d4ed8;
  }

  .status-trial {
    background: #ccfbf1;
    color: #0f766e;
  }

  .status-green-hold {
    background: #dcfce7;
    color: #15803d;
  }

  .status-yellow-hold {
    background: #fef3c7;
    color: #a16207;
  }

  .status-neutral {
    background: #eef2f7;
    color: #475467;
  }

  .status-cancel {
    background: #fee2e2;
    color: #b91c1c;
  }

  .days-pill {
    display: inline-grid;
    place-items: center;
    width: 78px;
    min-height: 24px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    padding: 5px 8px;
    white-space: nowrap;
  }

  .days-one {
    background: #e0f2fe;
    color: #0369a1;
  }

  .days-two {
    background: #dbeafe;
    color: #1d4ed8;
  }

  .days-three {
    background: #ede9fe;
    color: #6d28d9;
  }

  .days-four {
    background: #cffafe;
    color: #0e7490;
  }

  .days-neutral {
    background: #eef2f7;
    color: #475467;
  }

  .boolean-indicator {
    display: inline-grid;
    place-items: center;
    font-weight: 800;
    line-height: 1;
  }

  .boolean-true {
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: var(--accent);
    color: #ffffff;
    font-size: 14px;
  }

  .boolean-false {
    color: var(--muted);
    font-size: 16px;
  }

  .member-table tbody tr {
    cursor: pointer;
  }

  .member-table tbody tr:hover,
  .member-table tbody tr:focus {
    background: #f7fafc;
    outline: none;
  }

  .list {
    display: grid;
  }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 0;
    border-bottom: 1px solid var(--panel-border);
    background: transparent;
    color: inherit;
    cursor: pointer;
    padding: 14px 16px;
    text-align: left;
  }

  .list-item:hover {
    background: #f7fafc;
  }

  .list-item:last-child {
    border-bottom: 0;
  }

  .item-title {
    font-weight: 700;
  }

  .item-meta {
    color: var(--muted);
    font-size: 13px;
  }

  .search-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    margin-bottom: 16px;
  }

  .button {
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #ffffff;
    cursor: pointer;
    font-weight: 700;
    padding: 10px 16px;
  }

  .button:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  .button.danger-button {
    background: var(--danger);
    color: #ffffff;
  }

  .button.danger-button:hover:not(:disabled) {
    background: #912018;
  }

  .icon-button {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: #eef2f7;
    color: var(--text);
    cursor: pointer;
    font-weight: 700;
  }

  .icon-button:hover:not(:disabled) {
    background: #dfe5ed;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: rgba(16, 24, 32, 0.45);
    padding: 12px;
  }

  .modal {
    width: min(680px, 100%);
    max-height: calc(100vh - 24px);
    overflow: auto;
    border-radius: 8px;
    background: #ffffff;
    box-shadow: 0 24px 70px rgba(16, 24, 32, 0.28);
  }

  .member-modal {
    width: min(1080px, 100%);
  }

  .member-modal .modal-header {
    padding: 10px 12px;
  }

  .member-modal .panel-actions {
    gap: 6px;
  }

  .member-modal .button {
    padding: 8px 11px;
  }

  .member-save-actions {
    display: flex;
    justify-content: center;
    border-top: 1px solid var(--panel-border);
    padding: 10px 12px 12px;
  }

  .member-save-actions .button {
    min-width: 132px;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    padding: 14px 16px;
  }

  .modal-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    padding: 16px;
  }

  .form-field span {
    color: var(--muted);
    font-size: 13px;
  }

  .form-error {
    min-height: 20px;
    color: var(--danger);
    font-size: 14px;
  }

  .hold-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: #f8fafc;
    padding: 10px 12px;
  }

  .hold-summary span {
    color: var(--muted);
    font-size: 13px;
  }

  .hidden-form-field {
    display: none !important;
  }

  .hold-date-field span,
  .hold-date-field input {
    color: var(--text);
    font-weight: 800;
  }

  .modal-actions.hold-modal-actions {
    justify-content: center;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .member-layout {
    display: grid;
    gap: 16px;
  }

  .holds-layout {
    display: grid;
    gap: 16px;
  }

  .holds-panel .table-wrap {
    max-height: 36vh;
  }

  .data-table-wrap {
    max-height: calc(100vh - 170px);
  }

  .attendance-panel {
    min-height: calc(100vh - 116px);
  }

  .attendance-table-wrap {
    max-height: calc(100vh - 170px);
  }

  .attendance-table {
    min-width: 980px;
  }

  .attendance-table th {
    text-align: center;
    white-space: nowrap;
  }

  .attendance-table th:first-child,
  .attendance-table td:first-child {
    left: 0;
    min-width: 190px;
    position: sticky;
    text-align: left;
    z-index: 2;
  }

  .attendance-table td:first-child {
    background: #ffffff;
  }

  .attendance-table td {
    text-align: center;
  }

  .attendance-table thead th {
    background: #e2e8f0;
    color: var(--text);
    z-index: 3;
  }

  .attendance-table thead tr:first-child th {
    top: 0;
  }

  .attendance-table thead tr:nth-child(2) th {
    top: 38px;
  }

  .attendance-name-cell {
    cursor: pointer;
    font-weight: 800;
  }

  .attendance-category-cell {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .attendance-subhead {
    color: var(--muted);
    font-size: 11px;
  }

  .attendance-number-cell {
    font-variant-numeric: tabular-nums;
    min-width: 48px;
  }

  .attendance-week-no-show {
    background: #fee2e2;
    color: #991b1b;
  }

  .attendance-week-missed {
    background: #fef3c7;
    color: #92400e;
  }

  .attendance-week-hold {
    background: #e5e7eb;
    color: #4b5563;
  }

  .attendance-week-over {
    background: #dbeafe;
    color: #1d4ed8;
  }

  .attendance-week-met {
    background: #f8fafc;
  }

  .attendance-net-negative,
  .attendance-net-positive {
    font-weight: 900;
  }

  .attendance-net-positive {
    color: #047857;
  }

  .attendance-no-show .attendance-category-cell {
    color: #b91c1c;
  }

  .attendance-two-week-miss .attendance-category-cell,
  .attendance-missed-this-week .attendance-category-cell {
    color: #a16207;
  }

  .attendance-on-hold .attendance-category-cell {
    color: #4b5563;
  }

  .attendance-over-expected .attendance-category-cell {
    color: #1d4ed8;
  }

  .data-timeline-table {
    min-width: 1120px;
  }

  .data-timeline-table th,
  .data-timeline-table td {
    min-width: 74px;
    padding: 9px 10px;
    text-align: right;
    white-space: nowrap;
  }

  .data-timeline-table th:first-child,
  .data-timeline-table td:first-child {
    left: 0;
    min-width: 210px;
    position: sticky;
    text-align: left;
    z-index: 2;
  }

  .data-timeline-table th:nth-child(2),
  .data-timeline-table td:nth-child(2) {
    left: 210px;
    min-width: 78px;
    position: sticky;
    z-index: 2;
  }

  .data-timeline-table th:nth-child(3),
  .data-timeline-table td:nth-child(3) {
    left: 288px;
    min-width: 86px;
    position: sticky;
    z-index: 2;
  }

  .data-timeline-table td:first-child,
  .data-timeline-table td:nth-child(2),
  .data-timeline-table td:nth-child(3) {
    background: #ffffff;
  }

  .data-timeline-table thead th {
    background: #c9ced6;
    color: #000000;
    text-align: center;
    z-index: 3;
  }

  .data-timeline-table thead tr:first-child th {
    top: 0;
  }

  .data-timeline-table thead tr:nth-child(2) th {
    top: 38px;
  }

  .data-timeline-table .data-location-header {
    background: #5a83e6;
    color: #000000;
    font-size: 20px;
    text-align: left;
  }

  .data-timeline-table tbody tr:nth-child(even) td {
    background: #f4f4f4;
  }

  .data-timeline-table tbody tr:nth-child(even) td:first-child,
  .data-timeline-table tbody tr:nth-child(even) td:nth-child(2),
  .data-timeline-table tbody tr:nth-child(even) td:nth-child(3) {
    background: #f4f4f4;
  }

  .data-metric-cell {
    font-weight: 700;
  }

  .data-edit-input {
    min-width: 72px;
    padding: 5px 7px;
    text-align: right;
  }

  .section-header-green {
    background: #eaf2fb;
    color: #1f5594;
  }

  .section-header-yellow {
    background: #fff8c5;
    color: #713f12;
  }

  .section-header-upcoming {
    background: #f0f4ff;
    color: #1f3a8a;
  }

  .section-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.78);
    font-weight: 700;
  }

  .hold-table th {
    background: #f8fafc;
    color: var(--text);
  }

  .hold-table {
    table-layout: fixed;
    min-width: 980px;
  }

  .hold-table col.hold-col-name {
    width: 180px;
  }

  .hold-table col.hold-col-status {
    width: 150px;
  }

  .hold-table col.hold-col-age {
    width: 145px;
  }

  .hold-table col.hold-col-reason {
    width: 250px;
