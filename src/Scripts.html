<script>
  const LOCATION_STORAGE_KEY = 'flexx-last-location-key';

  const state = {
    config: null,
    locationKey: window.FLEXX_INITIAL_LOCATION_KEY,
    activeView: 'dashboard',
    selectedMember: null,
    dashboardColumns: [],
    dashboardRows: [],
    visibleDashboardColumns: [],
    cancellationsColumns: [],
    cancellationsRows: [],
    visibleCancellationsColumns: [],
    attendanceData: null,
    watchlistData: null,
    dataTimeline: null,
    holdsData: null,
    pendingHoldSaves: {},
    pendingWatchlistSaves: {},
    pendingCancellationSaves: {},
    pendingDataSaves: {},
    viewCache: {},
    loadingViews: {},
    globalSearchTimer: null,
    globalSearchRequestId: 0,
    mobileActionsMemberId: null,
    mobileDashboardMode: null,
    pendingDashboardCancel: null,
    dashboardSort: {
      column: 'Name',
      direction: 'asc'
    },
    cancellationsSort: {
      column: 'Cancel Date',
      direction: 'desc'
    },
    dirty: false,
    saving: false,
    holding: false,
    addingMember: false
  };

  const elements = {};

  document.addEventListener('DOMContentLoaded', () => {
    cacheElements();
    bindEvents();
    syncMobileLayoutClass();
    loadConfig();
  });

  function cacheElements() {
    elements.locationSelect = document.getElementById('locationSelect');
    elements.mobileMenuButton = document.getElementById('mobileMenuButton');
    elements.mobileCloseMenuButton = document.getElementById('mobileCloseMenuButton');
    elements.mobileDrawerBackdrop = document.getElementById('mobileDrawerBackdrop');
    elements.mobileSearchButton = document.getElementById('mobileSearchButton');
    elements.mobilePageTitle = document.getElementById('mobilePageTitle');
    elements.locationLabel = document.getElementById('locationLabel');
    elements.globalStatus = document.getElementById('globalStatus');
    elements.globalSearchInput = document.getElementById('globalSearchInput');
    elements.globalSearchResults = document.getElementById('globalSearchResults');
    elements.addMemberButton = document.getElementById('addMemberButton');
    elements.pageTitle = document.getElementById('pageTitle');
    elements.dashboardView = document.getElementById('dashboardView');
    elements.membersView = document.getElementById('membersView');
    elements.attendanceView = document.getElementById('attendanceView');
    elements.watchlistView = document.getElementById('watchlistView');
    elements.holdsView = document.getElementById('holdsView');
    elements.cancellationsView = document.getElementById('cancellationsView');
    elements.dataView = document.getElementById('dataView');
    elements.metricActive = document.getElementById('metricActive');
    elements.metricGreenHolds = document.getElementById('metricGreenHolds');
    elements.metricYellowHolds = document.getElementById('metricYellowHolds');
    elements.metricCancelsThisWeek = document.getElementById('metricCancelsThisWeek');
    elements.metricWeeklyNet = document.getElementById('metricWeeklyNet');
    elements.masterSnapshotPanel = document.getElementById('masterSnapshotPanel');
    elements.masterSnapshotTable = document.getElementById('masterSnapshotTable');
    elements.dashboardMembersPanel = document.getElementById('dashboardMembersPanel');
    elements.columnMenuButton = document.getElementById('columnMenuButton');
    elements.columnMenu = document.getElementById('columnMenu');
    elements.dashboardMemberTable = document.getElementById('dashboardMemberTable');
    elements.cancellationsColumnMenuButton = document.getElementById('cancellationsColumnMenuButton');
    elements.cancellationsColumnMenu = document.getElementById('cancellationsColumnMenu');
    elements.cancellationsTable = document.getElementById('cancellationsTable');
    elements.attendanceTitle = document.getElementById('attendanceTitle');
    elements.attendanceMeta = document.getElementById('attendanceMeta');
    elements.attendanceTable = document.getElementById('attendanceTable');
    elements.watchlistTitle = document.getElementById('watchlistTitle');
    elements.watchlistMeta = document.getElementById('watchlistMeta');
    elements.watchlistTable = document.getElementById('watchlistTable');
    elements.dataTimelineTitle = document.getElementById('dataTimelineTitle');
    elements.dataTimelineMeta = document.getElementById('dataTimelineMeta');
    elements.dataTimelineTable = document.getElementById('dataTimelineTable');
    elements.memberSearchInput = document.getElementById('memberSearchInput');
    elements.memberSearchButton = document.getElementById('memberSearchButton');
    elements.searchResults = document.getElementById('searchResults');
    elements.memberModal = document.getElementById('memberModal');
    elements.closeMemberModalButton = document.getElementById('closeMemberModalButton');
    elements.memberProfile = document.getElementById('memberProfile');
    elements.saveMemberButton = document.getElementById('saveMemberButton');
    elements.holdMemberButton = document.getElementById('holdMemberButton');
    elements.cancelMemberButton = document.getElementById('cancelMemberButton');
    elements.holdModal = document.getElementById('holdModal');
    elements.closeHoldModalButton = document.getElementById('closeHoldModalButton');
    elements.cancelHoldButton = document.getElementById('cancelHoldButton');
    elements.holdForm = document.getElementById('holdForm');
    elements.holdReasonInput = document.getElementById('holdReasonInput');
    elements.holdStartDateInput = document.getElementById('holdStartDateInput');
    elements.holdNextContactInput = document.getElementById('holdNextContactInput');
    elements.holdReturnDateInput = document.getElementById('holdReturnDateInput');
    elements.holdEndNurtureField = document.getElementById('holdEndNurtureField');
    elements.holdEndNurtureInput = document.getElementById('holdEndNurtureInput');
    elements.holdCalculatedStatus = document.getElementById('holdCalculatedStatus');
    elements.holdModalError = document.getElementById('holdModalError');
    elements.submitHoldButton = document.getElementById('submitHoldButton');
    elements.greenHoldsTable = document.getElementById('greenHoldsTable');
    elements.yellowHoldsTable = document.getElementById('yellowHoldsTable');
    elements.upcomingHoldsTable = document.getElementById('upcomingHoldsTable');
    elements.greenHoldsCount = document.getElementById('greenHoldsCount');
    elements.yellowHoldsCount = document.getElementById('yellowHoldsCount');
    elements.upcomingHoldsCount = document.getElementById('upcomingHoldsCount');
    elements.cancelModal = document.getElementById('cancelModal');
    elements.closeCancelModalButton = document.getElementById('closeCancelModalButton');
    elements.cancelCancelButton = document.getElementById('cancelCancelButton');
    elements.cancelForm = document.getElementById('cancelForm');
    elements.cancelReasonInput = document.getElementById('cancelReasonInput');
    elements.cancelSolutionInput = document.getElementById('cancelSolutionInput');
    elements.cancelDateInput = document.getElementById('cancelDateInput');
    elements.cancelModalError = document.getElementById('cancelModalError');
    elements.submitCancelButton = document.getElementById('submitCancelButton');
    elements.addMemberModal = document.getElementById('addMemberModal');
    elements.closeAddMemberModalButton = document.getElementById('closeAddMemberModalButton');
    elements.cancelAddMemberButton = document.getElementById('cancelAddMemberButton');
    elements.addMemberForm = document.getElementById('addMemberForm');
    elements.addFirstNameInput = document.getElementById('addFirstNameInput');
    elements.addLastNameInput = document.getElementById('addLastNameInput');
    elements.addStartDateInput = document.getElementById('addStartDateInput');
    elements.addDaysPerWeekInput = document.getElementById('addDaysPerWeekInput');
    elements.addPaymentOptionInput = document.getElementById('addPaymentOptionInput');
    elements.addPricePointInput = document.getElementById('addPricePointInput');
    elements.addTrialToggle = document.getElementById('addTrialToggle');
    elements.addTrialDateField = document.getElementById('addTrialDateField');
    elements.addTrialDateInput = document.getElementById('addTrialDateInput');
    elements.addReferralToggle = document.getElementById('addReferralToggle');
    elements.addReferralMemberField = document.getElementById('addReferralMemberField');
    elements.addReferralMemberInput = document.getElementById('addReferralMemberInput');
    elements.addRecurringToggle = document.getElementById('addRecurringToggle');
    elements.addNotesInput = document.getElementById('addNotesInput');
    elements.addMemberModalError = document.getElementById('addMemberModalError');
    elements.submitAddMemberButton = document.getElementById('submitAddMemberButton');
    elements.mobileMemberActions = document.getElementById('mobileMemberActions');
    elements.mobileActionName = document.getElementById('mobileActionName');
    elements.mobileActionStatus = document.getElementById('mobileActionStatus');
    elements.mobileMoveActiveButton = document.getElementById('mobileMoveActiveButton');
    elements.mobileHoldButton = document.getElementById('mobileHoldButton');
    elements.mobileEditInfoButton = document.getElementById('mobileEditInfoButton');
    elements.mobileCancelMemberButton = document.getElementById('mobileCancelMemberButton');
    elements.mobileCloseActionsButton = document.getElementById('mobileCloseActionsButton');
    elements.inlineDatePicker = null;
  }

  function bindEvents() {
    elements.mobileMenuButton.addEventListener('click', openMobileMenu);
    elements.mobileCloseMenuButton.addEventListener('click', closeMobileMenu);
    elements.mobileDrawerBackdrop.addEventListener('click', closeMobileMenu);
    elements.mobileSearchButton.addEventListener('click', toggleMobileSearch);
    elements.mobileMemberActions.addEventListener('click', (event) => {
      if (event.target === elements.mobileMemberActions) {
        closeMobileMemberActions();
      }
    });
    elements.mobileCloseActionsButton.addEventListener('click', closeMobileMemberActions);
    elements.mobileEditInfoButton.addEventListener('click', openSelectedMemberFromMobileActions);
    elements.mobileHoldButton.addEventListener('click', openHoldFromMobileActions);
    elements.mobileMoveActiveButton.addEventListener('click', moveMobileMemberToActive);
    elements.mobileCancelMemberButton.addEventListener('click', openCancelFromMobileActions);
    window.addEventListener('resize', handleViewportChange);
    window.addEventListener('orientationchange', handleViewportChange);

    document.querySelectorAll('.nav-item[data-view]').forEach((button) => {
      button.addEventListener('click', () => switchView(button.dataset.view));
    });

    elements.locationSelect.addEventListener('change', () => {
      state.locationKey = elements.locationSelect.value;
      saveLastLocationKey(state.locationKey);
      state.selectedMember = null;
      state.dirty = false;
      state.loadingViews = {};
      updateUrlLocation();
      renderLocationLabel();
      clearMemberProfile();
      clearSearchResults();
      if (isMasterLocation() && state.activeView !== 'dashboard') {
        switchView('dashboard');
        return;
      }
      loadActiveViewData();
    });

    elements.memberSearchButton.addEventListener('click', runSearch);
    elements.memberSearchInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        runSearch();
      }
    });
    elements.globalSearchInput.addEventListener('input', handleGlobalSearchInput);
    elements.globalSearchInput.addEventListener('keydown', handleGlobalSearchKeydown);
    document.addEventListener('click', closeGlobalSearchOnOutsideClick);
    elements.addMemberButton.addEventListener('click', openAddMemberModal);
    elements.closeAddMemberModalButton.addEventListener('click', closeAddMemberModal);
    elements.cancelAddMemberButton.addEventListener('click', closeAddMemberModal);
    elements.addMemberForm.addEventListener('submit', submitAddMemberForm);
    bindYesNoToggle(elements.addTrialToggle, false, (isActive) => {
      elements.addTrialDateField.hidden = !isActive;
      if (!isActive) {
        elements.addTrialDateInput.value = '';
      }
    });
    bindYesNoToggle(elements.addReferralToggle, false, (isActive) => {
      elements.addReferralMemberField.hidden = !isActive;
      if (!isActive) {
        elements.addReferralMemberInput.value = '';
      }
    });
    bindYesNoToggle(elements.addRecurringToggle, false);
    elements.saveMemberButton.addEventListener('click', saveMember);
    elements.closeMemberModalButton.addEventListener('click', closeMemberModal);
    elements.holdMemberButton.addEventListener('click', handleHoldAction);
    elements.cancelMemberButton.addEventListener('click', openCancelModal);
    elements.closeHoldModalButton.addEventListener('click', closeHoldModal);
    elements.cancelHoldButton.addEventListener('click', closeHoldModal);
    elements.holdStartDateInput.addEventListener('change', updateHoldModalFields);
    elements.holdReturnDateInput.addEventListener('change', updateHoldModalFields);
    elements.holdForm.addEventListener('submit', submitHoldForm);
    elements.columnMenuButton.addEventListener('click', toggleColumnMenu);
    elements.cancellationsColumnMenuButton.addEventListener('click', toggleCancellationsColumnMenu);
    document.addEventListener('click', closeColumnMenuOnOutsideClick);
    elements.holdModal.addEventListener('click', (event) => {
      if (event.target === elements.holdModal) {
        closeHoldModal();
      }
    });
    elements.memberModal.addEventListener('click', (event) => {
      if (event.target === elements.memberModal) {
        closeMemberModal();
      }
    });
    elements.closeCancelModalButton.addEventListener('click', closeCancelModal);
    elements.cancelCancelButton.addEventListener('click', closeCancelModal);
    elements.cancelForm.addEventListener('submit', submitCancelForm);
    elements.cancelModal.addEventListener('click', (event) => {
      if (event.target === elements.cancelModal) {
        closeCancelModal();
      }
    });
    elements.addMemberModal.addEventListener('click', (event) => {
      if (event.target === elements.addMemberModal) {
        closeAddMemberModal();
      }
    });
  }

  function loadConfig() {
    setStatus('Loading app...');
    google.script.run
      .withSuccessHandler((config) => {
        state.config = config;
        state.locationKey = getInitialLocationKey(config);
        saveLastLocationKey(state.locationKey);
        renderLocations();
        renderLocationLabel();
        loadDashboard();
      })
      .withFailureHandler(showError)
      .getAppConfig(state.locationKey);
  }

  function getInitialLocationKey(config) {
    const requestedLocationKey = getUrlLocationKey();
    if (requestedLocationKey && config.locations.some((location) => location.key === requestedLocationKey)) {
      return requestedLocationKey;
    }

    const savedLocationKey = getSavedLastLocationKey();
    if (savedLocationKey && config.locations.some((location) => location.key === savedLocationKey)) {
      return savedLocationKey;
    }

    return config.selectedLocationKey || config.defaultLocationKey;
  }

  function getUrlLocationKey() {
    try {
      return new URLSearchParams(window.location.search).get('location') || '';
    } catch (error) {
      return '';
    }
  }

  function getSavedLastLocationKey() {
    try {
      return localStorage.getItem(LOCATION_STORAGE_KEY) || '';
    } catch (error) {
      return '';
    }
  }

  function saveLastLocationKey(locationKey) {
    try {
      if (locationKey) {
        localStorage.setItem(LOCATION_STORAGE_KEY, locationKey);
      }
    } catch (error) {
      // Local storage can be unavailable in some embedded browser modes.
    }
  }

  function renderLocations() {
    elements.locationSelect.innerHTML = '';
    state.config.locations.forEach((location) => {
      const option = document.createElement('option');
      option.value = location.key;
      option.textContent = location.name;
      elements.locationSelect.appendChild(option);
    });
    elements.locationSelect.value = state.locationKey;
  }

  function renderLocationLabel() {
    const location = getCurrentLocation();
    elements.locationLabel.textContent = location ? location.name : '';
    elements.addMemberButton.disabled = isMasterLocation();
    elements.globalSearchInput.disabled = isMasterLocation();
    elements.globalSearchInput.placeholder = isMasterLocation() ? 'Select a location to search' : 'Search members';
    if (isMasterLocation()) {
      elements.globalSearchInput.value = '';
      clearGlobalSearchResults();
    }
  }

  function getCurrentLocation() {
    if (!state.config) {
      return null;
    }
    return state.config.locations.find((location) => location.key === state.locationKey);
  }

  function isMasterLocation() {
    return state.locationKey === 'master';
  }

  function switchView(view) {
    if (isMasterLocation() && view !== 'dashboard') {
      view = 'dashboard';
    }
    state.activeView = view;
    elements.pageTitle.textContent = getViewTitle(view);
    elements.mobilePageTitle.textContent = getViewTitle(view);
    closeMobileMenu();
    closeMobileSearch();
    document.querySelectorAll('.nav-item[data-view]').forEach((button) => {
      button.classList.toggle('active', button.dataset.view === view);
    });
    elements.dashboardView.classList.toggle('active', view === 'dashboard');
    elements.membersView.classList.toggle('active', view === 'members');
    elements.attendanceView.classList.toggle('active', view === 'attendance');
    elements.watchlistView.classList.toggle('active', view === 'watchlist');
    elements.holdsView.classList.toggle('active', view === 'holds');
    elements.cancellationsView.classList.toggle('active', view === 'cancellations');
    elements.dataView.classList.toggle('active', view === 'data');
    loadActiveViewData();
  }

  function getViewTitle(view) {
    if (view === 'members') {
      return 'Members';
    }
    if (view === 'holds') {
      return 'Holds';
    }
    if (view === 'attendance') {
      return 'Attendance';
    }
    if (view === 'watchlist') {
      return 'Watch List';
    }
    if (view === 'cancellations') {
      return 'Cancellations';
    }
    if (view === 'data') {
      return 'Data';
    }
    return 'Members';
  }

  function isMobileView() {
    return window.matchMedia('(max-width: 700px), (pointer: coarse)').matches;
  }

  function syncMobileLayoutClass() {
    document.body.classList.toggle('mobile-layout', isMobileView());
  }

  function openMobileMenu() {
    document.body.classList.add('mobile-menu-open');
    elements.mobileDrawerBackdrop.hidden = false;
  }

  function closeMobileMenu() {
    document.body.classList.remove('mobile-menu-open');
    elements.mobileDrawerBackdrop.hidden = true;
  }

  function toggleMobileSearch() {
    const isOpen = document.body.classList.toggle('mobile-search-open');
    if (isOpen) {
      window.setTimeout(() => elements.globalSearchInput.focus(), 0);
    } else {
      elements.globalSearchInput.blur();
      clearGlobalSearchResults();
    }
  }

  function closeMobileSearch() {
    document.body.classList.remove('mobile-search-open');
    clearGlobalSearchResults();
  }

  function handleViewportChange() {
    syncMobileLayoutClass();
    const isMobile = isMobileView();
    if (state.mobileDashboardMode === isMobile) {
      return;
    }
    state.mobileDashboardMode = isMobile;
    if (state.activeView === 'dashboard' && state.dashboardRows.length && !isMasterLocation()) {
      renderDashboardTable();
    }
    if (!isMobile) {
      closeMobileMenu();
      closeMobileSearch();
      closeMobileMemberActions();
    }
  }

  function openMobileMemberActions(member) {
    if (!member || !member.memberId) {
      return;
    }
    state.mobileActionsMemberId = member.memberId;
    const status = member.fields['Membership Status'] || '';
    const normalizedStatus = String(status).trim().toLowerCase();
    const isHold = normalizedStatus === 'green hold' || normalizedStatus === 'yellow hold';
    elements.mobileActionName.textContent = member.fields.Name || 'Member';
    elements.mobileActionStatus.textContent = status;
    elements.mobileActionStatus.className = `mobile-action-status ${getStatusClass(normalizedStatus)}`;
    elements.mobileMoveActiveButton.hidden = !isHold;
    elements.mobileHoldButton.textContent = isHold ? 'Edit Hold' : 'Put on Hold';
    elements.mobileCancelMemberButton.hidden = normalizedStatus === 'cancel';
    elements.mobileMemberActions.hidden = false;
  }

  function closeMobileMemberActions() {
    elements.mobileMemberActions.hidden = true;
  }

  function openSelectedMemberFromMobileActions() {
    const memberId = state.mobileActionsMemberId;
    closeMobileMemberActions();
    if (memberId) {
      loadMember(memberId);
    }
  }

  function openHoldFromMobileActions() {
    const memberId = state.mobileActionsMemberId;
    closeMobileMemberActions();
    if (!memberId) {
      return;
    }
    loadMemberForAction(memberId, (member) => {
      const status = String(member.fields['Membership Status'] || '').trim();
      const defaultStatus = status === 'Yellow Hold' ? 'Yellow Hold' : 'Green Hold';
      openHoldModal(defaultStatus);
    });
  }

  function openCancelFromMobileActions() {
    const memberId = state.mobileActionsMemberId;
    closeMobileMemberActions();
    if (memberId) {
      loadMemberForAction(memberId, openCancelModal);
    }
  }

  function moveMobileMemberToActive() {
    const memberId = state.mobileActionsMemberId;
    if (!memberId || state.saving) {
      return;
    }

    state.saving = true;
    elements.mobileMoveActiveButton.disabled = true;
    setStatus('Moving member to active...');
    google.script.run
      .withSuccessHandler((member) => {
        state.saving = false;
        state.selectedMember = member;
        closeMobileMemberActions();
        elements.mobileMoveActiveButton.disabled = false;
        clearViewCaches();
        loadActiveViewData();
        setStatus('Member moved to active.');
      })
      .withFailureHandler((error) => {
        state.saving = false;
        elements.mobileMoveActiveButton.disabled = false;
        showError(error);
      })
      .setMemberStatus(state.locationKey, {
        memberId: memberId,
        status: 'Active'
      });
  }

  function loadActiveViewData() {
    if (state.activeView === 'holds') {
      loadHolds();
    } else if (state.activeView === 'attendance') {
      loadAttendance();
    } else if (state.activeView === 'watchlist') {
      loadWatchlist();
    } else if (state.activeView === 'cancellations') {
      loadCancellations();
    } else if (state.activeView === 'data') {
      loadDataTimeline();
    } else if (state.activeView === 'dashboard') {
      loadDashboard();
    }
  }

  function loadDashboard() {
    const requestLocationKey = state.locationKey;
    const cachedData = getCachedViewData('dashboard');
    if (cachedData) {
      renderDashboard(cachedData);
      setStatus('Refreshing dashboard...');
    } else {
      setStatus('Loading dashboard...');
      setDashboardLoading();
    }
    if (state.loadingViews.dashboard) {
      return;
    }
    state.loadingViews.dashboard = true;
    google.script.run
      .withSuccessHandler((data) => {
        if (requestLocationKey !== state.locationKey) {
          return;
        }
        state.loadingViews.dashboard = false;
        setCachedViewData('dashboard', data);
        renderDashboard(data);
        setStatus('');
        prefetchHolds();
        prefetchCancellations();
      })
      .withFailureHandler((error) => {
        if (requestLocationKey !== state.locationKey) {
          return;
        }
        state.loadingViews.dashboard = false;
        showError(error);
      })
      .getDashboardData(state.locationKey);
  }

  function setDashboardLoading() {
    elements.metricActive.textContent = '-';
    elements.metricGreenHolds.textContent = '-';
    elements.metricYellowHolds.textContent = '-';
    elements.metricCancelsThisWeek.textContent = '-';
    elements.metricWeeklyNet.textContent = '-';
    elements.dashboardMemberTable.className = 'table-wrap empty-state';
    elements.dashboardMemberTable.textContent = 'Loading members...';
    elements.masterSnapshotPanel.hidden = true;
    elements.dashboardMembersPanel.hidden = false;
    elements.masterSnapshotTable.className = 'table-wrap empty-state';
    elements.masterSnapshotTable.textContent = 'Loading locations...';
    elements.columnMenu.hidden = true;
    elements.columnMenuButton.setAttribute('aria-expanded', 'false');
  }

  function renderDashboard(data) {
    elements.metricActive.textContent = data.summary.active + data.summary.greenHolds;
    elements.metricGreenHolds.textContent = data.summary.greenHolds;
    elements.metricYellowHolds.textContent = data.summary.yellowHolds;
    elements.metricCancelsThisWeek.textContent = data.summary.cancelsThisWeek;
    elements.metricWeeklyNet.textContent = formatSignedNumber(data.summary.weeklyNet || 0);

    if (data.master) {
      state.dashboardColumns = [];
      state.dashboardRows = [];
      state.visibleDashboardColumns = [];
      elements.dashboardMembersPanel.hidden = true;
      elements.masterSnapshotPanel.hidden = false;
      renderMasterSnapshotTable(data.snapshotRows || []);
      return;
    }

    elements.masterSnapshotPanel.hidden = true;
    elements.dashboardMembersPanel.hidden = false;
    state.dashboardColumns = data.memberTable.columns;
    state.dashboardRows = data.memberTable.rows;
    state.visibleDashboardColumns = restoreVisibleColumns(data.memberTable);
    renderColumnMenu();
    renderDashboardTable();
  }

  function renderMasterSnapshotTable(rows) {
    if (!rows.length) {
      elements.masterSnapshotTable.className = 'table-wrap empty-state';
      elements.masterSnapshotTable.textContent = 'No locations found.';
      return;
    }

    const columns = [
      { key: 'locationName', label: 'Location' },
      { key: 'activeMembers', label: 'Active Members' },
      { key: 'greenHolds', label: 'Holds' },
      { key: 'yellowHolds', label: 'Extended Holds' },
      { key: 'cancelsThisWeek', label: 'Cancels This Week' },
      { key: 'weeklyNet', label: 'Weekly Net' }
    ];
    const table = document.createElement('table');
    table.className = 'member-table master-snapshot-table';
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    columns.forEach((column) => {
      const th = document.createElement('th');
      th.textContent = column.label;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    rows.forEach((entry) => {
      const row = document.createElement('tr');
      columns.forEach((column) => {
        const td = document.createElement('td');
        td.dataset.label = column.label;
        const value = entry[column.key];
        td.textContent = column.key === 'weeklyNet' ? formatSignedNumber(value || 0) : value;
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);

    elements.masterSnapshotTable.className = 'table-wrap';
    elements.masterSnapshotTable.innerHTML = '';
    elements.masterSnapshotTable.appendChild(table);
  }

  function loadAttendance() {
    const requestLocationKey = state.locationKey;
    const cachedData = getCachedViewData('attendance');
    if (cachedData) {
      renderAttendance(cachedData);
      setStatus('Refreshing attendance...');
    } else {
      setStatus('Loading attendance...');
      setAttendanceLoading();
    }
    if (state.loadingViews.attendance) {
      return;
    }
    state.loadingViews.attendance = true;
    google.script.run
      .withSuccessHandler((data) => {
        if (requestLocationKey !== state.locationKey) {
          return;
        }
        state.loadingViews.attendance = false;
        setCachedViewData('attendance', data);
        renderAttendance(data);
        setStatus('');
      })
      .withFailureHandler((error) => {
        if (requestLocationKey !== state.locationKey) {
          return;
        }
        state.loadingViews.attendance = false;
        showError(error);
      })
      .getAttendanceData(state.locationKey);
  }

  function setAttendanceLoading() {
    elements.attendanceTitle.textContent = 'Attendance';
    elements.attendanceMeta.textContent = '';
    elements.attendanceTable.className = 'table-wrap empty-state';
    elements.attendanceTable.textContent = 'Loading attendance...';
  }

  function renderAttendance(data) {
    state.attendanceData = data;
    elements.attendanceTitle.textContent = `${data.locationName || 'Location'} Attendance`;
    elements.attendanceMeta.textContent = data.periods && data.periods.length
      ? `Last ${data.periods.length} weeks`
      : '';

  function renderWatchlistCell(cell, column, entry) {
    const value = getFieldValue(entry.fields, column);
    const pendingKey = getWatchlistCellKey(entry, column);
    const isPending = Boolean(state.pendingWatchlistSaves[pendingKey]);
    cell.classList.toggle('pending-cell', isPending);

    if (column === 'Monday Text' || column === 'Wednesday Text') {
      const select = document.createElement('select');
      const normalizedValue = normalizeWatchlistYesNo(value);
      select.className = `table-control watchlist-select ${getWatchlistYesNoClass(normalizedValue)}`;
      ['Yes', 'No'].forEach((optionValue) => {
        const option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });
      select.value = normalizedValue;
      select.disabled = isPending;
      select.addEventListener('change', () => {
        select.className = `table-control watchlist-select ${getWatchlistYesNoClass(select.value)}`;
        saveWatchlistEntry(entry, column, select.value, cell);
      });
      cell.appendChild(select);
      return;
    }

    if (column === 'On schedule?') {
      const select = document.createElement('select');
      select.className = `table-control watchlist-select ${getWatchlistScheduleClass(value)}`;
      ['On', 'Off'].forEach((optionValue) => {
        const option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);

      if (value && value !== 'On' && value !== 'Off') {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);

      select.value = value || 'On';

      });

      return;
    }

    const input = document.createElement('input');
    input.className = 'table-control watchlist-input';
    input.value = value;
    input.disabled = isPending;
    input.addEventListener('blur', () => {
      if (input.value !== value) {
        saveWatchlistEntry(entry, column, input.value, cell);

      if (event.key === 'Enter') {
        input.blur();
      }

  function saveWatchlistEntry(entry, column, value, cell) {
    const pendingKey = getWatchlistCellKey(entry, column);
    if (state.pendingWatchlistSaves[pendingKey]) {
      setStatus('Still saving that cell...');
      return;
    }

    const previousValue = getFieldValue(entry.fields, column);
    entry.fields[column] = value;
    state.pendingWatchlistSaves[pendingKey] = true;
    if (cell) {
      cell.classList.add('pending-cell');
      const control = cell.querySelector('.table-control');
      if (control) {
        control.disabled = true;
      }
    }
    setStatus('Saving watchlist...');
    google.script.run
      .withSuccessHandler((data) => {
        delete state.pendingWatchlistSaves[pendingKey];
        setCachedViewData('watchlist', data);
        state.watchlistData = data;
        if (cell) {
          cell.classList.remove('pending-cell');
          const control = cell.querySelector('.table-control');
          if (control) {
            control.disabled = false;
          }
        }
        setStatus('Watchlist updated.');
      })
      .withFailureHandler((error) => {
        delete state.pendingWatchlistSaves[pendingKey];
        entry.fields[column] = previousValue;
        loadWatchlist();
        showError(error);
      })
      .updateMemberWatchlistEntry(state.locationKey, {
        rowNumber: entry.rowNumber,
        fields: {
          [column]: value
        }
      });
  }

      container.className = 'table-wrap empty-state';

      return;
    }

    const table = document.createElement('table');

    });

    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    rows.forEach((entry) => {
      const row = document.createElement('tr');
      columns.forEach((column) => {
        const td = document.createElement('td');
        td.dataset.label = column;
        renderHoldCell(td, column, entry);
        row.appendChild(td);

    });
    table.appendChild(tbody);

    container.className = 'table-wrap';
    container.innerHTML = '';
    container.appendChild(table);
