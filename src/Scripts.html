  function getHoldColumnClass(column) {
    const normalized = String(column || '').trim().toLowerCase();
    if (normalized === 'name') {
      return 'hold-col-name';
    }
    if (normalized === 'membership status') {
      return 'hold-col-status';
    }
    if (normalized === 'membership age') {
      return 'hold-col-age';
    }
    if (normalized === 'reason') {
      return 'hold-col-reason';
    }
    if (normalized === 'end of 6-week nurture') {
      return 'hold-col-end-nurture';
    }
    return 'hold-col-date';
  }

  function renderHoldCell(cell, column, entry) {
    const value = getFieldValue(entry.fields, column);
    const isPending = isHoldCellPending(entry, column);
    if (isPending) {
      cell.classList.add('pending-cell');
    }

    if (entry.holdType === 'upcoming') {
      if ((column === 'Name' || column === 'Membership Age') && entry.memberId) {
        cell.classList.add('clickable-cell');
        cell.tabIndex = 0;
        cell.textContent = value;
        cell.addEventListener('click', () => loadMember(entry.memberId));
        cell.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            loadMember(entry.memberId);
          }
        });
        return;
      }
      if (isHoldDateColumn(column)) {
        renderHoldDateCell(cell, column, entry, value, isPending);
        return;
      }
      renderDashboardCell(cell, column, value);
      return;
    }

    if ((column === 'Name' || column === 'Membership Age') && entry.memberId) {
      cell.classList.add('clickable-cell');
      cell.tabIndex = 0;
      cell.textContent = value;
      cell.addEventListener('click', () => loadMember(entry.memberId));
      cell.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          loadMember(entry.memberId);
        }
      });
      return;
    }

    if (column === 'Membership Status') {
      const options = entry.holdType === 'green'
        ? ['Green Hold', 'Active', 'Trial', 'Yellow Hold', 'Cancel']
        : ['Yellow Hold', 'Active', 'Trial', 'Cancel'];
      const select = createStatusSelect(value, options, () => {
        saveHoldEntry(entry, { 'Membership Status': select.value });
      });
      select.disabled = isPending;
      cell.appendChild(select);
      return;
    }

    if (column === 'Reason') {
      const input = document.createElement('input');
      input.className = 'table-control';
      input.value = value;
      input.disabled = isPending;
      input.addEventListener('blur', () => {
        if (input.value !== value) {
          saveHoldEntry(entry, { Reason: input.value });
        }
      });
      cell.appendChild(input);
      return;
    }

    if (isHoldDateColumn(column)) {
      renderHoldDateCell(cell, column, entry, value, isPending);
      return;
    }

    renderDashboardCell(cell, column, value);
  }

  function isHoldDateColumn(column) {
    return column === 'Start Date' || column === 'Next Contact' || column === 'Return Date?' || column === 'End of 6-week Nurture';
  }

  function renderHoldDateCell(cell, column, entry, value, isPending) {
    const wrapper = document.createElement('div');
    wrapper.className = 'date-cell-control';
    const pickerButton = document.createElement('button');
    pickerButton.className = 'date-picker-button';
    pickerButton.type = 'button';
    pickerButton.disabled = isPending;
    pickerButton.textContent = value || 'Select date';
    pickerButton.addEventListener('click', () => {
      openInlineDatePicker(entry, column, value, pickerButton);
    });
    wrapper.appendChild(pickerButton);

    if (column === 'Next Contact' || column === 'Return Date?' || column === 'End of 6-week Nurture') {
      const clearButton = document.createElement('button');
      clearButton.className = 'date-clear-button';
      clearButton.type = 'button';
      clearButton.disabled = isPending;
      clearButton.setAttribute('aria-label', `Clear ${column}`);
      clearButton.textContent = 'x';
      clearButton.addEventListener('click', () => {
        const fieldUpdate = {};
        fieldUpdate[column] = '-';
        saveHoldEntry(entry, fieldUpdate);
      });
      wrapper.appendChild(clearButton);
    }

    cell.appendChild(wrapper);
  }

  function saveHoldEntry(entry, fields) {
    if (Object.keys(fields).some((fieldName) => isHoldCellPending(entry, fieldName))) {
      setStatus('Still saving that cell...');
      return;
    }

    setHoldCellsPending(entry, fields, true);
    applyOptimisticHoldUpdate(entry, fields);
    setStatus('Saving hold...');
    closeInlineDatePicker();
    google.script.run
      .withSuccessHandler((data) => {
        setHoldCellsPending(entry, fields, false);
        setCachedViewData('holds', data);
        renderHolds(data);
        loadDashboard();
        setStatus('Hold updated.');
      })
      .withFailureHandler((error) => {
        setHoldCellsPending(entry, fields, false);
        loadHolds();
        showError(error);
      })
      .updateHoldEntry(state.locationKey, {
        holdType: entry.holdType,
        rowNumber: entry.rowNumber,
        fields: fields
      });
  }

  function isHoldCellPending(entry, column) {
    return Boolean(state.pendingHoldSaves[getHoldCellKey(entry, column)]);
  }

  function setHoldCellsPending(entry, fields, isPending) {
    Object.keys(fields).forEach((fieldName) => {
      const key = getHoldCellKey(entry, fieldName);
      if (isPending) {
        state.pendingHoldSaves[key] = true;
      } else {
        delete state.pendingHoldSaves[key];
      }
    });
  }

  function getHoldCellKey(entry, column) {
    return `${entry.rowNumber}:${column}`;
  }

  function applyOptimisticHoldUpdate(entry, fields) {
    if (!state.holdsData) {
      return;
    }

    const section = entry.holdType === 'upcoming'
      ? state.holdsData.upcoming
      : (entry.holdType === 'yellow' ? state.holdsData.yellow : state.holdsData.green);
    const targetRow = section.rows.find((row) => row.rowNumber === entry.rowNumber);
    if (!targetRow) {
      return;
    }

    Object.keys(fields).forEach((fieldName) => {
      targetRow.fields[fieldName] = formatOptimisticHoldValue(fieldName, fields[fieldName]);
    });

    if (fields['Membership Status'] === 'Active' || fields['Membership Status'] === 'Trial' || fields['Membership Status'] === 'Cancel') {
      removeOptimisticHoldRow(entry.rowNumber);
      renderHolds(state.holdsData);
      return;
    }

    if (entry.holdType === 'upcoming') {
      applyOptimisticUpcomingHoldDateMath(targetRow);
      renderHolds(state.holdsData);
      return;
    }

    if (fields['Membership Status'] === 'Yellow Hold' && entry.holdType === 'green') {
      targetRow.holdType = 'yellow';
      targetRow.fields['Membership Status'] = 'Yellow Hold';
      targetRow.fields['Return Date?'] = '-';
    }

    applyOptimisticHoldDateMath(entry, targetRow);

    renderHolds(state.holdsData);
  }

  function applyOptimisticUpcomingHoldDateMath(targetRow) {
    const startInput = displayDateToInputValue(targetRow.fields['Start Date']);
    const returnValue = targetRow.fields['Return Date?'];
    const returnInput = returnValue === '-' ? '' : displayDateToInputValue(returnValue);
    const calculatedType = calculateHoldType(startInput, returnInput);
    targetRow.fields['Membership Status'] = calculatedType === 'yellow' ? 'Yellow Hold' : 'Green Hold';
    targetRow.fields['End of 6-week Nurture'] = calculatedType === 'yellow'
      ? addDaysToDisplayDate(targetRow.fields['Start Date'], 42)
      : '';
  }

  function applyOptimisticHoldDateMath(entry, targetRow) {
    if (targetRow.fields['Membership Status'] === 'Active' || targetRow.fields['Membership Status'] === 'Trial' || targetRow.fields['Membership Status'] === 'Cancel') {
      return;
    }

    const startInput = displayDateToInputValue(targetRow.fields['Start Date']);
    const returnValue = targetRow.fields['Return Date?'];
    const returnInput = returnValue === '-' ? '' : displayDateToInputValue(returnValue);
    const calculatedType = calculateHoldType(startInput, returnInput);

    if (calculatedType === 'yellow') {
      targetRow.fields['Membership Status'] = 'Yellow Hold';
      targetRow.holdType = 'yellow';
      targetRow.fields['End of 6-week Nurture'] = addDaysToDisplayDate(targetRow.fields['Start Date'], 42);
      if (entry.holdType === 'green') {
        removeOptimisticHoldRow(entry.rowNumber);
        state.holdsData.yellow.rows.unshift(targetRow);
      }
    } else {
      targetRow.fields['Membership Status'] = 'Green Hold';
      targetRow.holdType = 'green';
      targetRow.fields['End of 6-week Nurture'] = '';
      if (entry.holdType === 'yellow') {
        removeOptimisticHoldRow(entry.rowNumber);
        state.holdsData.green.rows.unshift(targetRow);
      }
    }
  }

  function removeOptimisticHoldRow(rowNumber) {
    state.holdsData.green.rows = state.holdsData.green.rows.filter((row) => row.rowNumber !== rowNumber);
    state.holdsData.yellow.rows = state.holdsData.yellow.rows.filter((row) => row.rowNumber !== rowNumber);
    if (state.holdsData.upcoming) {
      state.holdsData.upcoming.rows = state.holdsData.upcoming.rows.filter((row) => row.rowNumber !== rowNumber);
    }
  }

  function formatOptimisticHoldValue(fieldName, value) {
    if (value === '-') {
      return '-';
    }
    if (fieldName === 'Start Date' || fieldName === 'Next Contact' || fieldName === 'Return Date?' || fieldName === 'End of 6-week Nurture') {
      const parsed = parseInputDate(value);
      if (parsed) {
        return parsed.toLocaleDateString();
      }
    }
    return value;
  }

  function addDaysToDisplayDate(value, days) {
    const inputValue = displayDateToInputValue(value);
    const date = parseInputDate(inputValue);
    if (!date) {
      return '';
    }
    date.setDate(date.getDate() + days);
    return date.toLocaleDateString();
  }

  function openInlineDatePicker(entry, column, value, anchorElement, onSelect) {
    closeInlineDatePicker();

    const selectedDate = parseDisplayOrInputDate(value) || new Date();
    const pickerState = {
      entry: entry,
      column: column,
      monthDate: new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1),
      selectedDate: selectedDate,
      onSelect: onSelect
    };

    const backdrop = document.createElement('div');
    backdrop.className = 'inline-date-backdrop';
    backdrop.addEventListener('click', (event) => {
      if (event.target === backdrop) {
        closeInlineDatePicker();
      }
    });

    const picker = document.createElement('div');
    picker.className = 'inline-date-picker';
    backdrop.appendChild(picker);
    document.body.appendChild(backdrop);
    elements.inlineDatePicker = backdrop;

    renderInlineDatePicker(picker, pickerState);
    positionInlineDatePicker(picker, anchorElement);
  }

  function positionInlineDatePicker(picker, anchorElement) {
    if (!anchorElement) {
      return;
    }

    const gap = 6;
    const margin = 8;
    const anchorRect = anchorElement.getBoundingClientRect();
    const pickerRect = picker.getBoundingClientRect();
    const left = Math.min(
      Math.max(anchorRect.left, margin),
      window.innerWidth - pickerRect.width - margin
    );
    const belowTop = anchorRect.bottom + gap;
    const aboveTop = anchorRect.top - pickerRect.height - gap;
    const top = belowTop + pickerRect.height + margin <= window.innerHeight
      ? belowTop
      : Math.max(aboveTop, margin);

    picker.style.left = `${left}px`;
    picker.style.top = `${top}px`;
  }

  function renderInlineDatePicker(container, pickerState) {
    container.innerHTML = '';

    const monthsWrap = document.createElement('div');
    monthsWrap.className = 'inline-date-months';
    for (let monthOffset = 0; monthOffset < 6; monthOffset += 1) {
      const monthDate = new Date(
        pickerState.monthDate.getFullYear(),
        pickerState.monthDate.getMonth() + monthOffset,
        1
      );
      renderInlineDateMonth(monthsWrap, pickerState, monthDate);
    }
    container.appendChild(monthsWrap);
  }

  function renderInlineDateMonth(container, pickerState, monthDate) {
    const monthSection = document.createElement('section');
    monthSection.className = 'inline-date-month';

    const monthTitle = document.createElement('strong');
    monthTitle.textContent = monthDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    monthSection.appendChild(monthTitle);

    const weekdays = document.createElement('div');
    weekdays.className = 'inline-date-weekdays';
    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach((day) => {
      const label = document.createElement('span');
      label.textContent = day;
      weekdays.appendChild(label);
    });
    monthSection.appendChild(weekdays);

    const grid = document.createElement('div');
    grid.className = 'inline-date-grid';
    const firstDayOffset = monthDate.getDay();
    const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();

    for (let i = 0; i < firstDayOffset; i += 1) {
      grid.appendChild(document.createElement('span'));
    }

    for (let day = 1; day <= daysInMonth; day += 1) {
      const date = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = String(day);
      if (isSameDate(date, pickerState.selectedDate)) {
        button.className = 'selected';
      }
      button.addEventListener('click', () => {
        const selectedValue = formatInputDate(date);
        if (typeof pickerState.onSelect === 'function') {
          pickerState.onSelect(selectedValue);
          return;
        }
        const fieldUpdate = {};
        fieldUpdate[pickerState.column] = selectedValue;
        saveHoldEntry(pickerState.entry, fieldUpdate);
      });
      grid.appendChild(button);
    }
    monthSection.appendChild(grid);
    container.appendChild(monthSection);
  }

  function closeInlineDatePicker() {
    if (elements.inlineDatePicker) {
      elements.inlineDatePicker.remove();
      elements.inlineDatePicker = null;
    }
  }

  function parseDisplayOrInputDate(value) {
    return parseInputDate(value) || parseDisplayDate(value);
  }

  function parseDisplayDate(value) {
    const match = String(value || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!match) {
      return null;
    }
    return new Date(Number(match[3]), Number(match[1]) - 1, Number(match[2]));
  }

  function isSameDate(left, right) {
    return right &&
      left.getFullYear() === right.getFullYear() &&
      left.getMonth() === right.getMonth() &&
      left.getDate() === right.getDate();
  }

  function restoreVisibleColumns(memberTable) {
    return restoreVisibleColumnsForTable(memberTable, 'dashboard');
  }

  function restoreVisibleColumnsForTable(memberTable, tableKey) {
    const savedColumns = readSavedColumns(tableKey);
    if (Array.isArray(savedColumns)) {
      const validSavedColumns = savedColumns.filter((column) => memberTable.columns.indexOf(column) > -1);
      if (validSavedColumns.length) {
        return orderVisibleColumns(validSavedColumns, memberTable.columns);
      }
    }
    return memberTable.defaultVisibleColumns.slice();
  }

  function renderColumnMenu() {
    elements.columnMenu.innerHTML = '';
    state.dashboardColumns.forEach((column) => {
      const label = document.createElement('label');
      label.className = 'column-option';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = state.visibleDashboardColumns.indexOf(column) > -1;
      checkbox.addEventListener('change', () => {
        toggleDashboardColumn(column, checkbox.checked);
      });

      const text = document.createElement('span');
      text.textContent = column;

      label.appendChild(checkbox);
      label.appendChild(text);
      elements.columnMenu.appendChild(label);
    });
  }

  function renderCancellationsColumnMenu() {
    elements.cancellationsColumnMenu.innerHTML = '';
    state.cancellationsColumns.forEach((column) => {
      const label = document.createElement('label');
      label.className = 'column-option';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = state.visibleCancellationsColumns.indexOf(column) > -1;
      checkbox.addEventListener('change', () => {
        toggleCancellationsColumn(column, checkbox.checked);
      });

      const text = document.createElement('span');
      text.textContent = column;

      label.appendChild(checkbox);
      label.appendChild(text);
      elements.cancellationsColumnMenu.appendChild(label);
    });
  }

  function renderDashboardTable() {
    if (!state.dashboardRows.length) {
      elements.dashboardMemberTable.className = 'table-wrap empty-state';
      elements.dashboardMemberTable.textContent = 'No members found.';
      return;
    }

    if (isMobileView()) {
      renderMobileDashboardTable();
      return;
    }

    if (!state.visibleDashboardColumns.length) {
      elements.dashboardMemberTable.className = 'table-wrap empty-state';
      elements.dashboardMemberTable.textContent = 'Choose at least one column.';
      return;
    }

    const table = document.createElement('table');
    table.className = 'member-table';

    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    state.visibleDashboardColumns.forEach((column) => {
      const th = document.createElement('th');
      if (state.dashboardSort.column === column) {
        th.setAttribute('aria-sort', state.dashboardSort.direction === 'asc' ? 'ascending' : 'descending');
      }
      const sortButton = document.createElement('button');
      sortButton.className = 'table-sort-button';
      sortButton.type = 'button';
      sortButton.textContent = column;
      sortButton.setAttribute('aria-label', `Sort by ${column}`);
      sortButton.addEventListener('click', () => sortDashboardTable(column));

      if (state.dashboardSort.column === column) {
        const indicator = document.createElement('span');
        indicator.className = 'sort-indicator';
        indicator.innerHTML = state.dashboardSort.direction === 'asc' ? '&uarr;' : '&darr;';
        sortButton.appendChild(indicator);
      }

      th.appendChild(sortButton);
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    getSortedDashboardRows().forEach((member) => {
      const row = document.createElement('tr');
      row.tabIndex = 0;
      row.addEventListener('click', () => loadMember(member.memberId));
      row.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          loadMember(member.memberId);
        }
      });

      state.visibleDashboardColumns.forEach((column) => {
        const td = document.createElement('td');
        td.dataset.label = column;
        renderDashboardCell(td, column, member.fields[column], member);
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);

    elements.dashboardMemberTable.className = 'table-wrap';
    elements.dashboardMemberTable.innerHTML = '';
    elements.dashboardMemberTable.appendChild(table);
  }

  function renderMobileDashboardTable() {
    const table = document.createElement('table');
    table.className = 'member-table mobile-dashboard-table';

    const tbody = document.createElement('tbody');
    getSortedDashboardRows().forEach((member) => {
      const row = document.createElement('tr');
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-label', `Open actions for ${member.fields.Name || 'member'}`);
      row.addEventListener('click', () => openMobileMemberActions(member));
      row.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          openMobileMemberActions(member);
        }
      });

      const nameCell = document.createElement('td');
      nameCell.dataset.label = 'Name';
      nameCell.textContent = member.fields.Name || '';
      row.appendChild(nameCell);

      const statusCell = document.createElement('td');
      statusCell.dataset.label = 'Membership Status';
      const status = member.fields['Membership Status'] || '';
      const statusPill = document.createElement('span');
      statusPill.className = `mobile-status-value ${getStatusClass(String(status).trim().toLowerCase())}`;
      statusPill.textContent = status;
      statusCell.appendChild(statusPill);
      row.appendChild(statusCell);

      tbody.appendChild(row);
    });
    table.appendChild(tbody);

    elements.dashboardMemberTable.className = 'table-wrap mobile-dashboard-wrap';
    elements.dashboardMemberTable.innerHTML = '';
    elements.dashboardMemberTable.appendChild(table);
  }

  function renderCancellationsTable() {
    if (!state.cancellationsRows.length) {
      elements.cancellationsTable.className = 'table-wrap empty-state';
      elements.cancellationsTable.textContent = 'No cancellations found.';
      return;
    }

    if (!state.visibleCancellationsColumns.length) {
      elements.cancellationsTable.className = 'table-wrap empty-state';
      elements.cancellationsTable.textContent = 'Choose at least one column.';
      return;
    }

    const table = document.createElement('table');
    table.className = 'member-table';

    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    state.visibleCancellationsColumns.forEach((column) => {
      const th = document.createElement('th');
      if (state.cancellationsSort.column === column) {
        th.setAttribute('aria-sort', state.cancellationsSort.direction === 'asc' ? 'ascending' : 'descending');
      }
      const sortButton = document.createElement('button');
      sortButton.className = 'table-sort-button';
      sortButton.type = 'button';
      sortButton.textContent = column;
      sortButton.setAttribute('aria-label', `Sort by ${column}`);
      sortButton.addEventListener('click', () => sortCancellationsTable(column));

      if (state.cancellationsSort.column === column) {
        const indicator = document.createElement('span');
        indicator.className = 'sort-indicator';
        indicator.innerHTML = state.cancellationsSort.direction === 'asc' ? '&uarr;' : '&darr;';
        sortButton.appendChild(indicator);
      }

      th.appendChild(sortButton);
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    getSortedCancellationsRows().forEach((entry) => {
      const row = document.createElement('tr');
      if (entry.memberId) {
        row.tabIndex = 0;
        row.addEventListener('click', () => loadMember(entry.memberId));
        row.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            loadMember(entry.memberId);
          }
        });
      }

      state.visibleCancellationsColumns.forEach((column) => {
        const td = document.createElement('td');
        td.dataset.label = column;
        renderCancellationCell(td, column, entry);
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);

    elements.cancellationsTable.className = 'table-wrap';
    elements.cancellationsTable.innerHTML = '';
    elements.cancellationsTable.appendChild(table);
  }

  function renderCancellationCell(cell, column, entry) {
    const value = getFieldValue(entry.fields, column);
    const isPending = isCancellationCellPending(entry, column);
    if (isPending) {
      cell.classList.add('pending-cell');
    }

    if (column === 'Membership Status') {
      cell.appendChild(createStatusSelect(value || 'Cancel', ['Cancel', 'Active', 'Trial'], (select) => {
        handleCancellationStatusChange(entry, select);
      }));
      return;
    }

    if (column === 'Reason' || column === 'Solution') {
      const input = document.createElement('input');
      input.className = 'table-control';
      input.value = value;
      input.disabled = isPending;
      input.addEventListener('click', (event) => event.stopPropagation());
      input.addEventListener('keydown', (event) => {
        event.stopPropagation();
        if (event.key === 'Enter') {
          input.blur();
        }
      });
      input.addEventListener('blur', () => {
        if (input.value !== value) {
          const fields = {};
          fields[column] = input.value;
          saveCancellationFields(entry, fields, { redraw: false });
        }
      });
      cell.appendChild(input);
      return;
    }

    if (column === 'Last Contact') {
      const pickerButton = document.createElement('button');
      pickerButton.className = 'date-picker-button';
      pickerButton.type = 'button';
      pickerButton.disabled = isPending;
      pickerButton.textContent = value || 'Select date';
      pickerButton.addEventListener('click', (event) => {
        event.stopPropagation();
        openInlineDatePicker(entry, column, value, pickerButton, (selectedValue) => {
          saveCancellationFields(entry, { 'Last Contact': selectedValue });
        });
      });
      cell.appendChild(pickerButton);
      return;
    }

    if (column === 'Stay in contact') {
      const label = document.createElement('label');
      label.className = 'table-checkbox-control';
      label.addEventListener('click', (event) => event.stopPropagation());
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = isTruthyDisplayValue(value);
      checkbox.disabled = isPending;
      checkbox.addEventListener('change', () => {
        saveCancellationFields(entry, { 'Stay in contact': checkbox.checked });
      });
      const mark = document.createElement('span');
      mark.textContent = checkbox.checked ? 'Yes' : 'No';
      label.appendChild(checkbox);
      label.appendChild(mark);
      cell.appendChild(label);
      return;
    }

    if (entry.memberId) {
      cell.classList.add('clickable-cell');
    }
    renderTableDisplayCell(cell, column, value);
  }

  function saveCancellationFields(entry, fields, options) {
    const shouldRedraw = !options || options.redraw !== false;
    if (Object.keys(fields).some((fieldName) => isCancellationCellPending(entry, fieldName))) {
      setStatus('Still saving that cell...');
      return;
    }

    setCancellationCellsPending(entry, fields, true);
    Object.keys(fields).forEach((fieldName) => {
      entry.fields[fieldName] = fields[fieldName];
    });
    if (shouldRedraw) {
      renderCancellationsTable();
    }
    setStatus('Saving cancellation...');
    closeInlineDatePicker();
    google.script.run
      .withSuccessHandler((updatedEntry) => {
        setCancellationCellsPending(entry, fields, false);
        const target = state.cancellationsRows.find((row) => row.rowNumber === updatedEntry.rowNumber);
        if (target) {
          target.fields = updatedEntry.fields;
        }
        setCachedViewData('cancellations', {
          columns: state.cancellationsColumns,
          defaultVisibleColumns: state.visibleCancellationsColumns,
          rows: state.cancellationsRows
        });
        if (shouldRedraw) {
          renderCancellationsTable();
        }
        setStatus('Cancellation updated.');
      })
      .withFailureHandler((error) => {
        setCancellationCellsPending(entry, fields, false);
        loadCancellations();
        showError(error);
      })
      .updateCancellationEntry(state.locationKey, {
        rowNumber: entry.rowNumber,
        fields: fields
      });
  }

  function isCancellationCellPending(entry, column) {
    return Boolean(state.pendingCancellationSaves[getCancellationCellKey(entry, column)]);
  }

  function setCancellationCellPending(entry, column, isPending) {
    const key = getCancellationCellKey(entry, column);
    if (isPending) {
      state.pendingCancellationSaves[key] = true;
    } else {
      delete state.pendingCancellationSaves[key];
    }
  }

  function setCancellationCellsPending(entry, fields, isPending) {
    Object.keys(fields).forEach((fieldName) => {
      setCancellationCellPending(entry, fieldName, isPending);
    });
  }

  function getCancellationCellKey(entry, column) {
    return `${entry.rowNumber}:${column}`;
  }

  function handleCancellationStatusChange(entry, select) {
    const nextStatus = select.value;
    const previousStatus = entry.fields['Membership Status'] || 'Cancel';
    if (nextStatus === previousStatus) {
      return;
    }

    if (nextStatus !== 'Active' && nextStatus !== 'Trial') {
      select.value = previousStatus;
      select.className = `table-control status-select ${getStatusClass(previousStatus.trim().toLowerCase())}`;
      return;
    }

    entry.fields['Membership Status'] = nextStatus;
    renderCancellationsTable();
    setStatus('Updating member status...');
    google.script.run
      .withSuccessHandler((updatedMember) => {
        const target = state.cancellationsRows.find((row) => row.rowNumber === entry.rowNumber);
        if (target) {
          target.fields['Membership Status'] = updatedMember.fields['Membership Status'];
        }
        renderCancellationsTable();
        loadDashboard();
        setStatus('Member status updated.');
      })
      .withFailureHandler((error) => {
        loadCancellations();
        showError(error);
      })
      .reactivateCancellationMember(state.locationKey, {
        status: nextStatus,
        cancellationRowNumber: entry.rowNumber
      });
  }

  function renderDashboardCell(cell, column, value, member) {
    if (column === 'Membership Status') {
      if (member && member.memberId) {
        cell.appendChild(createStatusSelect(value, ['Active', 'Trial', 'Green Hold', 'Yellow Hold', 'Cancel'], (select) => {
          handleDashboardStatusChange(member, select);
        }));
      } else {
        const pill = document.createElement('span');
        const normalizedStatus = String(value || '').trim().toLowerCase();
        pill.className = `status-pill ${getStatusClass(normalizedStatus)}`;
        pill.textContent = value || '';
        cell.appendChild(pill);
      }
      return;
    }

    renderTableDisplayCell(cell, column, value);
  }

  function renderTableDisplayCell(cell, column, value) {
    if (column === 'Price Point') {
      cell.textContent = formatPricePoint(value);
      return;
    }

    if (column === 'Days Per Week') {
      renderDaysPerWeekPill(cell, value);
      return;
    }

    if (renderBooleanDisplay(cell, value)) {
      return;
    }

    cell.textContent = value || '';
  }

  function getFieldValue(fields, column) {
    return Object.prototype.hasOwnProperty.call(fields, column) ? fields[column] : '';
  }

  function renderBooleanDisplay(cell, value) {
    const booleanValue = getBooleanDisplayValue(value);
    if (booleanValue === null) {
      return false;
    }

    const indicator = document.createElement('span');
    indicator.className = booleanValue ? 'boolean-indicator boolean-true' : 'boolean-indicator boolean-false';
    indicator.textContent = booleanValue ? '✓' : '-';
    indicator.setAttribute('aria-label', booleanValue ? 'True' : 'False');
    cell.appendChild(indicator);
    return true;
  }

  function getBooleanDisplayValue(value) {
    if (value === true) {
      return true;
    }
    if (value === false) {
      return false;
    }

    const normalized = String(value || '').trim().toLowerCase();
    if (normalized === 'true' || normalized === 'yes') {
      return true;
    }
    if (normalized === 'false' || normalized === 'no') {
      return false;
    }
    return null;
  }

  function isTruthyDisplayValue(value) {
    return getBooleanDisplayValue(value) === true;
  }

  function formatPricePoint(value) {
    const raw = String(value || '').trim();
    if (!raw) {
      return '';
    }

    const numericValue = Number(raw.replace(/[$,]/g, ''));
    if (Number.isNaN(numericValue)) {
      return raw;
    }

    return `$${numericValue.toLocaleString(undefined, {
      minimumFractionDigits: numericValue % 1 === 0 ? 0 : 2,
      maximumFractionDigits: 2
    })}`;
  }

  function formatSignedNumber(value) {
    const numberValue = Number(value || 0);
    if (numberValue > 0) {
      return `+${numberValue}`;
    }
    return String(numberValue);
  }

  function renderDaysPerWeekPill(cell, value) {
    const pill = document.createElement('span');
    pill.className = `days-pill ${getDaysPerWeekClass(value)}`;
    pill.textContent = value || '-';
    cell.appendChild(pill);
  }

  function getDaysPerWeekClass(value) {
    const normalized = String(value || '').trim().toLowerCase();
    if (normalized === '1x/week') {
      return 'days-one';
    }
    if (normalized === '2x/week') {
      return 'days-two';
    }
    if (normalized === '3x/week') {
      return 'days-three';
    }
    if (normalized === '4x/week') {
      return 'days-four';
    }
    return 'days-neutral';
  }

  function createStatusSelect(value, options, onChange) {
    const select = document.createElement('select');
    select.className = `table-control status-select ${getStatusClass(String(value || '').trim().toLowerCase())}`;
    options.forEach((optionValue) => {
      const option = document.createElement('option');
      option.value = optionValue;
      option.textContent = optionValue;
      select.appendChild(option);
    });
    select.value = value || options[0];
    select.addEventListener('click', (event) => event.stopPropagation());
    select.addEventListener('keydown', (event) => event.stopPropagation());
    select.addEventListener('change', () => {
      select.className = `table-control status-select ${getStatusClass(select.value.trim().toLowerCase())}`;
      onChange(select);
    });
    return select;
  }

  function handleDashboardStatusChange(member, select) {
    const nextStatus = select.value;
    const previousStatus = member.fields['Membership Status'] || 'Active';
    if (nextStatus === previousStatus) {
      return;
    }

    if (nextStatus === 'Green Hold' || nextStatus === 'Yellow Hold') {
      select.value = previousStatus;
      select.className = `table-control status-select ${getStatusClass(previousStatus.trim().toLowerCase())}`;
      selectDashboardMemberForImmediateAction(member);
      openHoldModal(nextStatus);
      refreshSelectedMemberForAction(member.memberId);
      return;
    }

    if (nextStatus === 'Cancel') {
      state.pendingDashboardCancel = {
        memberId: member.memberId,
        previousStatus: previousStatus,
        memberSnapshot: {
          memberId: member.memberId,
          fields: Object.assign({}, member.fields)
        }
      };
      member.fields['Membership Status'] = 'Cancel';
      select.className = `table-control status-select ${getStatusClass('cancel')}`;
      selectDashboardMemberForImmediateAction(member);
      openCancelModal();
      refreshSelectedMemberForAction(member.memberId);
      return;
    }

    saveDashboardStatus(member, nextStatus);
  }

  function selectDashboardMemberForImmediateAction(member) {
    state.selectedMember = {
      memberId: member.memberId,
      fields: Object.assign({}, member.fields),
      editableFields: [],
      lockedFields: []
    };
    state.dirty = false;
    updateProfileActions();
  }

  function refreshSelectedMemberForAction(memberId) {
    google.script.run
      .withSuccessHandler((member) => {
        if (!state.selectedMember || state.selectedMember.memberId !== memberId) {
          return;
        }
        state.selectedMember = member;
        state.dirty = false;
        updateProfileActions();
      })
      .withFailureHandler((error) => {
        showError(error);
      })
      .getMember(state.locationKey, memberId);
  }

  function saveDashboardStatus(member, status) {
    member.fields['Membership Status'] = status;
    renderDashboardTable();
    setStatus('Saving status...');
    google.script.run
      .withSuccessHandler((updatedMember) => {
        const target = state.dashboardRows.find((row) => row.memberId === member.memberId);
        if (target) {
          target.fields['Membership Status'] = updatedMember.fields['Membership Status'];
        }
        renderDashboardTable();
        loadDashboard();
        setStatus('Status updated.');
      })
      .withFailureHandler((error) => {
        loadDashboard();
        showError(error);
      })
      .setMemberStatus(state.locationKey, {
        memberId: member.memberId,
        status: status
      });
  }

  function getStatusClass(normalizedStatus) {
    if (normalizedStatus === 'active') {
      return 'status-active';
    }
    if (normalizedStatus === 'trial') {
      return 'status-trial';
    }
    if (normalizedStatus === 'green hold') {
      return 'status-green-hold';
    }
    if (normalizedStatus === 'yellow hold') {
      return 'status-yellow-hold';
    }
    if (normalizedStatus === 'cancel') {
      return 'status-cancel';
    }
    return 'status-neutral';
  }

  function sortDashboardTable(column) {
    if (state.dashboardSort.column === column) {
      state.dashboardSort.direction = state.dashboardSort.direction === 'asc' ? 'desc' : 'asc';
    } else {
      state.dashboardSort.column = column;
      state.dashboardSort.direction = 'asc';
    }
    renderDashboardTable();
  }

  function getSortedDashboardRows() {
    const directionMultiplier = state.dashboardSort.direction === 'asc' ? 1 : -1;
    return state.dashboardRows.slice().sort((a, b) => {
      const left = getSortableValue(a.fields[state.dashboardSort.column]);
      const right = getSortableValue(b.fields[state.dashboardSort.column]);

      if (left.type === 'empty' && right.type === 'empty') {
        return 0;
      }
      if (left.type === 'empty') {
        return 1;
      }
      if (right.type === 'empty') {
        return -1;
      }
      if (left.value < right.value) {
        return -1 * directionMultiplier;
      }
      if (left.value > right.value) {
        return 1 * directionMultiplier;
      }
      return 0;
    });
  }

  function sortCancellationsTable(column) {
    if (state.cancellationsSort.column === column) {
      state.cancellationsSort.direction = state.cancellationsSort.direction === 'asc' ? 'desc' : 'asc';
    } else {
      state.cancellationsSort.column = column;
      state.cancellationsSort.direction = 'asc';
    }
    renderCancellationsTable();
  }

  function getSortedCancellationsRows() {
    const directionMultiplier = state.cancellationsSort.direction === 'asc' ? 1 : -1;
    return state.cancellationsRows.slice().sort((a, b) => {
      const left = getSortableValue(a.fields[state.cancellationsSort.column]);
      const right = getSortableValue(b.fields[state.cancellationsSort.column]);

      if (left.type === 'empty' && right.type === 'empty') {
        return 0;
      }
      if (left.type === 'empty') {
        return 1;
      }
      if (right.type === 'empty') {
        return -1;
      }
      if (left.value < right.value) {
        return -1 * directionMultiplier;
      }
      if (left.value > right.value) {
        return 1 * directionMultiplier;
      }
      return 0;
    });
  }

  function getSortableValue(value) {
    const raw = String(value || '').trim();
    if (!raw) {
      return { type: 'empty', value: '' };
    }

    const dateParts = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (dateParts) {
      return {
        type: 'date',
        value: Number(dateParts[3]) * 10000 + Number(dateParts[1]) * 100 + Number(dateParts[2])
      };
    }

    const numericValue = Number(raw.replace(/[$,%]/g, ''));
    if (!isNaN(numericValue) && raw.match(/\d/)) {
      return { type: 'number', value: numericValue };
    }

    return { type: 'text', value: raw.toLowerCase() };
  }

  function toggleDashboardColumn(column, shouldShow) {
    if (shouldShow) {
      if (state.visibleDashboardColumns.indexOf(column) === -1) {
        state.visibleDashboardColumns.push(column);
      }
    } else {
      state.visibleDashboardColumns = state.visibleDashboardColumns.filter((visibleColumn) => visibleColumn !== column);
    }
    state.visibleDashboardColumns = orderVisibleColumns(state.visibleDashboardColumns, state.dashboardColumns);
    saveDashboardColumns();
    renderDashboardTable();
  }

  function toggleCancellationsColumn(column, shouldShow) {
    if (shouldShow) {
      if (state.visibleCancellationsColumns.indexOf(column) === -1) {
        state.visibleCancellationsColumns.push(column);
      }
    } else {
      state.visibleCancellationsColumns = state.visibleCancellationsColumns.filter((visibleColumn) => visibleColumn !== column);
    }
    state.visibleCancellationsColumns = orderVisibleColumns(state.visibleCancellationsColumns, state.cancellationsColumns);
    saveColumns('cancellations', state.visibleCancellationsColumns);
    renderCancellationsTable();
  }

  function orderVisibleColumns(visibleColumns, sourceColumns) {
    return sourceColumns.filter((column) => visibleColumns.indexOf(column) > -1);
  }

  function toggleColumnMenu() {
    const willOpen = elements.columnMenu.hidden;
    elements.columnMenu.hidden = !willOpen;
    elements.columnMenuButton.setAttribute('aria-expanded', String(willOpen));
  }

  function toggleCancellationsColumnMenu() {
    const willOpen = elements.cancellationsColumnMenu.hidden;
    elements.cancellationsColumnMenu.hidden = !willOpen;
    elements.cancellationsColumnMenuButton.setAttribute('aria-expanded', String(willOpen));
  }

  function closeColumnMenuOnOutsideClick(event) {
    if (
      !elements.columnMenu.hidden &&
      !elements.columnMenu.contains(event.target) &&
      !elements.columnMenuButton.contains(event.target)
    ) {
      elements.columnMenu.hidden = true;
      elements.columnMenuButton.setAttribute('aria-expanded', 'false');
    }

    if (
      !elements.cancellationsColumnMenu.hidden &&
      !elements.cancellationsColumnMenu.contains(event.target) &&
      !elements.cancellationsColumnMenuButton.contains(event.target)
    ) {
      elements.cancellationsColumnMenu.hidden = true;
      elements.cancellationsColumnMenuButton.setAttribute('aria-expanded', 'false');
    }
  }

  function getColumnStorageKey() {
    return getTableColumnStorageKey('dashboard');
  }

  function getTableColumnStorageKey(tableKey) {
    return `flexx-${tableKey}-columns:${state.locationKey}`;
  }

  function readSavedDashboardColumns() {
    return readSavedColumns('dashboard');
  }

  function readSavedColumns(tableKey) {
    try {
      return JSON.parse(localStorage.getItem(getTableColumnStorageKey(tableKey)) || 'null');
    } catch (error) {
      return null;
    }
  }

  function saveDashboardColumns() {
    saveColumns('dashboard', state.visibleDashboardColumns);
  }

  function saveColumns(tableKey, columns) {
    try {
      localStorage.setItem(getTableColumnStorageKey(tableKey), JSON.stringify(columns));
    } catch (error) {
      return;
    }
  }

  function handleGlobalSearchInput() {
    const query = elements.globalSearchInput.value.trim();
    window.clearTimeout(state.globalSearchTimer);
    state.globalSearchRequestId += 1;

    if (query.length < 2) {
      clearGlobalSearchResults();
      return;
    }

    const requestId = state.globalSearchRequestId;
    const localResults = getCachedMemberSearchResults(query);
    if (localResults) {
      renderGlobalSearchResults(localResults);
      return;
    }

    state.globalSearchTimer = window.setTimeout(() => {
      renderGlobalSearchLoading();
      const requestLocationKey = state.locationKey;
      google.script.run
        .withSuccessHandler((results) => {
          if (requestId !== state.globalSearchRequestId || requestLocationKey !== state.locationKey) {
            return;
          }
          renderGlobalSearchResults(results);
        })
        .withFailureHandler((error) => {
          if (requestId !== state.globalSearchRequestId) {
            return;
          }
          renderGlobalSearchMessage(error.message || 'Search failed.');
        })
        .searchMembers(state.locationKey, query);
    }, 180);
  }

  function getCachedMemberSearchResults(query) {
    const rows = getCachedMemberRows();
    if (!rows) {
      return null;
    }

    const searchTerm = String(query || '').trim().toLowerCase();
    return rows.map((member) => {
      const name = getFieldValue(member.fields, 'Name');
      const score = getLocalNameSearchScore(name, searchTerm);
      if (score === null) {
        return null;
      }
      const status = getFieldValue(member.fields, 'Membership Status');
      return {
        memberId: member.memberId,
        name: name,
        membershipStatus: status,
        meta: status,
        source: 'Members',
        score: score
      };
    }).filter(Boolean).sort((left, right) => {
      if (left.score !== right.score) {
        return left.score - right.score;
      }
      return String(left.name || '').localeCompare(String(right.name || ''));
    }).slice(0, 10).map((result) => {
      delete result.score;
      return result;
    });
  }

  function getCachedMemberRows() {
    if (state.dashboardRows && state.dashboardRows.length) {
      return state.dashboardRows;
    }
    const cachedDashboard = getCachedViewData('dashboard');
    if (cachedDashboard && cachedDashboard.memberTable && cachedDashboard.memberTable.rows) {
      return cachedDashboard.memberTable.rows;
    }
    return null;
  }

  function getLocalNameSearchScore(name, searchTerm) {
    const normalizedName = String(name || '').trim().toLowerCase();
    if (!normalizedName || !searchTerm) {
      return null;
    }
    if (normalizedName === searchTerm) {
      return 0;
    }
    if (normalizedName.startsWith(searchTerm)) {
      return 1;
    }
    const index = normalizedName.indexOf(searchTerm);
    if (index > -1) {
      return 2 + (index / 100);
    }
    const parts = normalizedName.split(/[\s,]+/).filter(Boolean);
    for (let partIndex = 0; partIndex < parts.length; partIndex += 1) {
      if (parts[partIndex].startsWith(searchTerm)) {
        return 3 + (partIndex / 100);
      }
    }
    return null;
  }

  function handleGlobalSearchKeydown(event) {
    if (event.key === 'Escape') {
      clearGlobalSearchResults();
      elements.globalSearchInput.blur();
      return;
    }

    if (event.key === 'Enter') {
      const firstResult = elements.globalSearchResults.querySelector('.global-search-item');
      if (firstResult) {
        event.preventDefault();
        firstResult.click();
      }
    }
  }

  function renderGlobalSearchLoading() {
    renderGlobalSearchMessage('Searching...');
  }

  function renderGlobalSearchMessage(message) {
    elements.globalSearchResults.hidden = false;
    elements.globalSearchResults.className = 'global-search-results';
    elements.globalSearchResults.innerHTML = `<div class="global-search-message">${escapeHtml(message)}</div>`;
  }

  function renderGlobalSearchResults(results) {
    if (!results || !results.length) {
      renderGlobalSearchMessage('No matching members found.');
      return;
    }

    elements.globalSearchResults.hidden = false;
    elements.globalSearchResults.className = 'global-search-results';
    elements.globalSearchResults.innerHTML = '';

    results.forEach((result) => {
      const button = document.createElement('button');
      button.className = 'global-search-item';
      button.type = 'button';
      const sourceMarkup = result.source ? `<span class="search-source-pill">${escapeHtml(result.source)}</span>` : '';
      button.innerHTML = `
        <span class="global-search-primary">
          <span class="item-title">${escapeHtml(result.name || 'Unnamed member')}</span>
          <span class="item-meta">${escapeHtml(result.meta || result.membershipStatus || '')}</span>
        </span>
        <span class="global-search-secondary">
          <span class="status-pill ${getStatusClass(String(result.membershipStatus || '').trim().toLowerCase())}">
            ${escapeHtml(result.membershipStatus || result.source || '')}
          </span>
          ${sourceMarkup}
        </span>
      `;
      button.addEventListener('click', () => {
        elements.globalSearchInput.value = '';
        clearGlobalSearchResults();
        if (result.memberId) {
          loadMember(result.memberId);
        }
      });
      elements.globalSearchResults.appendChild(button);
    });
  }

  function clearGlobalSearchResults() {
    window.clearTimeout(state.globalSearchTimer);
    elements.globalSearchResults.hidden = true;
    elements.globalSearchResults.innerHTML = '';
  }

  function closeGlobalSearchOnOutsideClick(event) {
    if (!elements.globalSearchInput.contains(event.target) && !elements.globalSearchResults.contains(event.target)) {
      clearGlobalSearchResults();
    }
  }

  function runSearch() {
    const query = elements.memberSearchInput.value.trim();
    if (!query) {
      clearSearchResults();
      return;
    }

    switchView('members');
    setStatus('Searching...');
    elements.memberSearchButton.disabled = true;
    elements.searchResults.className = 'list empty-state';
    elements.searchResults.textContent = 'Searching members...';

    google.script.run
      .withSuccessHandler((results) => {
        elements.memberSearchButton.disabled = false;
        renderSearchResults(results);
        setStatus('');
      })
      .withFailureHandler((error) => {
        elements.memberSearchButton.disabled = false;
        showError(error);
      })
      .searchMembers(state.locationKey, query);
  }

  function renderSearchResults(results) {
    if (!results.length) {
      elements.searchResults.className = 'list empty-state';
      elements.searchResults.textContent = 'No matching members found.';
      return;
    }

    elements.searchResults.className = 'list';
    elements.searchResults.innerHTML = '';
    results.forEach((member) => {
      elements.searchResults.appendChild(createMemberListButton(member));
    });
  }

  function createMemberListButton(member) {
    const button = document.createElement('button');
    button.className = 'list-item';
    button.type = 'button';
    button.innerHTML = `
      <span>
        <span class="item-title">${escapeHtml(member.name || 'Unnamed member')}</span>
        <span class="item-meta">${escapeHtml(member.membershipStatus || '')}</span>
      </span>
      <span class="item-meta">#${member.memberId}</span>
    `;
    button.addEventListener('click', () => loadMember(member.memberId));
    return button;
  }

  function loadMember(memberId) {
    setStatus('Loading member...');
    elements.memberModal.hidden = false;
    elements.memberProfile.className = 'profile-form empty-state';
    elements.memberProfile.textContent = 'Loading member profile...';
    elements.saveMemberButton.disabled = true;
    elements.holdMemberButton.disabled = true;
    elements.cancelMemberButton.disabled = true;

    google.script.run
      .withSuccessHandler((member) => {
        state.selectedMember = member;
        state.dirty = false;
        renderMemberProfile(member);
        updateProfileActions();
        setStatus('');
      })
      .withFailureHandler(showError)
      .getMember(state.locationKey, memberId);
  }

  function loadMemberForAction(memberId, onLoaded) {
    setStatus('Loading member...');
    google.script.run
      .withSuccessHandler((member) => {
        state.selectedMember = member;
        state.dirty = false;
        updateProfileActions();
        setStatus('');
        if (typeof onLoaded === 'function') {
          onLoaded(member);
        }
      })
      .withFailureHandler(showError)
      .getMember(state.locationKey, memberId);
  }

  function closeMemberModal() {
    if (state.saving || state.holding) {
      return;
    }
    elements.memberModal.hidden = true;
  }

  function renderMemberProfile(member) {
    elements.memberProfile.className = 'profile-form member-profile-form';
    elements.memberProfile.innerHTML = '';

    const summary = document.createElement('section');
    summary.className = 'profile-summary-card';
    [
      'Name',
      'Membership Status',
      'Price Point',
      'Days Per Week',
      'Payment Option',
      'Start Date',
      'Referral Member'
    ].forEach((fieldName) => appendProfileField(summary, member, fieldName));
    elements.memberProfile.appendChild(summary);

    appendProfileField(elements.memberProfile, member, 'Notes', 'profile-notes-field');

    const toggleRow = document.createElement('section');
    toggleRow.className = 'profile-toggle-row';
    ['Reactivation', 'Recurring', 'Referral'].forEach((fieldName) => appendProfileField(toggleRow, member, fieldName, 'profile-toggle-field'));
    elements.memberProfile.appendChild(toggleRow);

    const context = document.createElement('section');
    context.className = 'profile-context-grid';
    appendTemperaturePreview(context);
    appendProfileField(context, member, 'Reason/Solution', 'profile-reason-field');
    elements.memberProfile.appendChild(context);

    updateSaveButton();
    updateProfileActions();
  }

  function appendProfileField(parent, member, fieldName, extraClassName) {
    if (!Object.prototype.hasOwnProperty.call(member.fields, fieldName)) {
      return;
    }

    const value = member.fields[fieldName] || '';
    const isEditable = member.editableFields.indexOf(fieldName) > -1;
    const wrapper = document.createElement('div');
    wrapper.className = `form-field ${extraClassName || ''}`.trim();

    const label = document.createElement('label');
    label.textContent = fieldName;
    wrapper.appendChild(label);
    wrapper.appendChild(isEditable ? createProfileInput(fieldName, value) : createReadOnlyProfileValue(fieldName, value));

    parent.appendChild(wrapper);
  }

  function appendTemperaturePreview(parent) {
    const wrapper = document.createElement('div');
    wrapper.className = 'form-field profile-temperature-field';

    const label = document.createElement('label');
    label.textContent = 'Temperature';
    wrapper.appendChild(label);

    const value = document.createElement('div');
    value.className = 'readonly-value temperature-preview';
    value.textContent = 'Not set';
    wrapper.appendChild(value);

    parent.appendChild(wrapper);
  }

  function createProfileInput(fieldName, value) {
    if (fieldName === 'Days Per Week') {
      return createSelectInput(fieldName, value, ['', '1x/Week', '2x/Week', '3x/Week', '4x/Week']);
    }
    if (fieldName === 'Payment Option') {
      return createSelectInput(fieldName, value, ['', 'Monthly', 'Bi-weekly', 'Weekly']);
    }
    if (fieldName === 'Price Point') {
      return createPricePointInput(fieldName, value);
    }
    if (isBooleanProfileField(fieldName)) {
      return createBooleanToggle(fieldName, value);
    }
    if (fieldName === 'Start Date') {
      const input = document.createElement('input');
      input.className = 'input';
      input.type = 'date';
      input.value = displayDateToInputValue(value);
      input.dataset.field = fieldName;
      input.addEventListener('input', markDirty);
      return input;
    }

    const input = fieldName === 'Notes' || fieldName === 'Reason/Solution' ? document.createElement('textarea') : document.createElement('input');
    input.className = fieldName === 'Notes' || fieldName === 'Reason/Solution' ? 'textarea' : 'input';
    input.value = value;
    input.dataset.field = fieldName;
    input.addEventListener('input', markDirty);
    return input;
  }

  function createPricePointInput(fieldName, value) {
    const wrapper = document.createElement('div');
    wrapper.className = 'price-input-wrap';

    const prefix = document.createElement('span');
    prefix.textContent = '$';
    wrapper.appendChild(prefix);

    const input = document.createElement('input');
    input.className = 'input';
    input.type = 'number';
    input.min = '0';
    input.step = '0.01';
    input.value = String(value || '').replace(/[$,]/g, '');
    input.dataset.field = fieldName;
    input.addEventListener('input', markDirty);
    wrapper.appendChild(input);

    return wrapper;
  }

  function createSelectInput(fieldName, value, options) {
    const select = document.createElement('select');
    select.className = 'select';
    select.dataset.field = fieldName;
    options.forEach((optionValue) => {
      const option = document.createElement('option');
      option.value = optionValue;
      option.textContent = optionValue || 'Select';
      select.appendChild(option);
    });
    select.value = value;
    select.addEventListener('change', markDirty);
    return select;
  }

  function createBooleanToggle(fieldName, value) {
    const wrapper = document.createElement('div');
    wrapper.className = 'yes-no-toggle';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.dataset.field = fieldName;
    input.value = getBooleanFieldValue(fieldName, normalizeBoolean(value));
    wrapper.appendChild(input);

    [
      { label: 'No', active: false },
      { label: 'Yes', active: true }
    ].forEach((option) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = option.label;
      button.setAttribute('aria-pressed', String(normalizeBoolean(input.value) === option.active));
      button.addEventListener('click', () => {
        input.value = getBooleanFieldValue(fieldName, option.active);
        wrapper.querySelectorAll('button').forEach((toggleButton) => {
          toggleButton.setAttribute('aria-pressed', String(toggleButton === button));
        });
        markDirty();
      });
      wrapper.appendChild(button);
    });

    return wrapper;
  }

  function isBooleanProfileField(fieldName) {
    return fieldName === 'Recurring' || fieldName === 'Reactivation' || fieldName === 'Referral';
  }

  function getBooleanFieldValue(fieldName, isActive) {
    if (fieldName === 'Recurring' || fieldName === 'Referral') {
      return isActive ? 'true' : 'false';
    }
    return isActive ? 'Yes' : 'No';
  }

  function createReadOnlyProfileValue(fieldName, value) {
    const readOnly = document.createElement('div');
    readOnly.className = 'readonly-value';
    if (fieldName === 'Membership Status') {
      const normalizedStatus = String(value || '').trim().toLowerCase();
      readOnly.className = `readonly-value profile-status-value ${getStatusClass(normalizedStatus)}`;
      readOnly.textContent = value || '';
    } else if (fieldName === 'Price Point') {
      readOnly.textContent = formatPricePoint(value);
    } else {
      readOnly.textContent = value;
    }
    return readOnly;
  }

  function markDirty() {
    state.dirty = true;
    updateSaveButton();
  }

  function updateSaveButton() {
    elements.saveMemberButton.disabled = !state.selectedMember || !state.dirty || state.saving;
    elements.saveMemberButton.textContent = state.saving ? 'Saving...' : 'Save';
  }

  function updateProfileActions() {
    const status = getSelectedMemberStatus();
    const hasEditableMemberRow = Boolean(state.selectedMember && state.selectedMember.memberId);
    elements.holdMemberButton.disabled = !hasEditableMemberRow || state.saving || state.holding;
    elements.cancelMemberButton.disabled = !hasEditableMemberRow || state.saving || state.holding || status === 'cancel';
    elements.holdMemberButton.textContent = state.holding ? 'Saving Hold...' : (isSelectedMemberOnHold() ? 'Edit Hold' : 'Put on Hold');
  }

  function saveMember(onSuccess) {
    if (!state.selectedMember || state.saving) {
      return;
    }

    const fields = {};
    elements.memberProfile.querySelectorAll('[data-field]').forEach((input) => {
      fields[input.dataset.field] = input.type === 'checkbox' ? input.checked : input.value;
    });

    state.saving = true;
    updateSaveButton();
    updateProfileActions();
    setStatus('Saving changes...');

    google.script.run
      .withSuccessHandler((member) => {
        state.selectedMember = member;
        state.dirty = false;
        state.saving = false;
        renderMemberProfile(member);
        updateProfileActions();
        loadActiveViewData();
        setStatus('Saved.');
        if (typeof onSuccess === 'function') {
          onSuccess(member);
        }
      })
      .withFailureHandler((error) => {
        state.saving = false;
        updateSaveButton();
        updateProfileActions();
        showError(error);
      })
      .saveMemberChanges(state.locationKey, {
        memberId: state.selectedMember.memberId,
        fields: fields
      });
  }

  function clearMemberProfile() {
    state.selectedMember = null;
    elements.memberModal.hidden = true;
    elements.memberProfile.className = 'profile-form empty-state';
    elements.memberProfile.textContent = 'Select a member to view details.';
    elements.saveMemberButton.disabled = true;
    elements.holdMemberButton.disabled = true;
    elements.cancelMemberButton.disabled = true;
  }

  function bindYesNoToggle(wrapper, initialValue, onChange) {
    setYesNoToggleValue(wrapper, initialValue);
    wrapper.querySelectorAll('button').forEach((button) => {
      button.addEventListener('click', () => {
        const isActive = button.dataset.value === 'true';
        setYesNoToggleValue(wrapper, isActive);
        if (typeof onChange === 'function') {
          onChange(isActive);
        }
      });
    });
  }

  function setYesNoToggleValue(wrapper, isActive) {
    wrapper.querySelectorAll('button').forEach((button) => {
      button.setAttribute('aria-pressed', String((button.dataset.value === 'true') === Boolean(isActive)));
    });
  }

  function getYesNoToggleValue(wrapper) {
    const selected = wrapper.querySelector('button[aria-pressed="true"]');
    return selected ? selected.dataset.value === 'true' : false;
  }

  function openAddMemberModal() {
    state.addingMember = false;
    updateAddMemberButtons();
    elements.addMemberForm.reset();
    elements.addStartDateInput.value = getTodayInputValue();
    elements.addDaysPerWeekInput.value = '2x/Week';
    elements.addPaymentOptionInput.value = 'Monthly';
    setYesNoToggleValue(elements.addTrialToggle, false);
    setYesNoToggleValue(elements.addReferralToggle, false);
    setYesNoToggleValue(elements.addRecurringToggle, false);
    elements.addTrialDateField.hidden = true;
    elements.addReferralMemberField.hidden = true;
    elements.addMemberModalError.textContent = '';
    elements.addMemberModal.hidden = false;
    elements.addFirstNameInput.focus();
  }

  function closeAddMemberModal() {
    if (state.addingMember) {
      return;
    }
    elements.addMemberModal.hidden = true;
    elements.addMemberModalError.textContent = '';
  }

  function submitAddMemberForm(event) {
    event.preventDefault();
    if (state.addingMember) {
      return;
    }

    if (!elements.addMemberForm.reportValidity()) {
      return;
    }

    state.addingMember = true;
    updateAddMemberButtons();
    setStatus('Adding member...');

    google.script.run
      .withSuccessHandler((member) => {
        state.addingMember = false;
        closeAddMemberModal();
        clearViewCaches();
        state.selectedMember = member;
        state.dirty = false;
        elements.memberModal.hidden = false;
        renderMemberProfile(member);
        updateProfileActions();
        loadActiveViewData();
        setStatus('Member added.');
      })
      .withFailureHandler((error) => {
        state.addingMember = false;
        updateAddMemberButtons();
        elements.addMemberModalError.textContent = error && error.message ? error.message : String(error || 'Could not add member.');
        showError(error);
      })
      .addMemberFromWebApp(state.locationKey, {
        firstName: elements.addFirstNameInput.value.trim(),
        lastName: elements.addLastNameInput.value.trim(),
        daysPerWeek: elements.addDaysPerWeekInput.value,
        paymentOption: elements.addPaymentOptionInput.value,
        pricePoint: elements.addPricePointInput.value,
        startDate: elements.addStartDateInput.value,
        trial: getYesNoToggleValue(elements.addTrialToggle),
        trialDate: elements.addTrialDateInput.value,
        referral: getYesNoToggleValue(elements.addReferralToggle),
        referralMember: elements.addReferralMemberInput.value.trim(),
        recurring: getYesNoToggleValue(elements.addRecurringToggle),
        notes: elements.addNotesInput.value.trim()
      });
  }

  function updateAddMemberButtons() {
    elements.submitAddMemberButton.disabled = state.addingMember;
    elements.cancelAddMemberButton.disabled = state.addingMember;
    elements.closeAddMemberModalButton.disabled = state.addingMember;
    elements.submitAddMemberButton.textContent = state.addingMember ? 'Adding...' : 'Add Member';
  }

  function handleHoldAction() {
    if (isSelectedMemberOnHold()) {
      saveMemberAndOpenHolds();
      return;
    }
    openHoldModal();
  }

  function saveMemberAndOpenHolds() {
    if (!state.selectedMember) {
      return;
    }
    const afterSave = function () {
      closeMemberModal();
      switchView('holds');
    };
    if (!state.dirty) {
      afterSave();
      return;
    }
    saveMember(afterSave);
  }

  function openHoldModal(defaultStatus) {
    if (!state.selectedMember) {
      return;
    }

    elements.holdForm.reset();
    elements.holdReasonInput.value = state.selectedMember.fields['Reason/Solution'] || '';
    elements.holdStartDateInput.value = getTodayInputValue();
    elements.holdReturnDateInput.value = defaultStatus === 'Green Hold'
      ? addDaysToInputDate(elements.holdStartDateInput.value, 14)
      : '';
    elements.holdModalError.textContent = '';
    updateHoldModalFields();
    elements.holdModal.hidden = false;
    elements.holdReasonInput.focus();
  }

  function openCancelModal() {
    if (!state.selectedMember) {
      return;
    }
    elements.cancelForm.reset();
    elements.cancelReasonInput.value = state.selectedMember.fields['Reason/Solution'] || '';
    elements.cancelDateInput.value = getTodayInputValue();
    elements.cancelModalError.textContent = '';
    elements.cancelModal.hidden = false;
    elements.cancelReasonInput.focus();
  }

  function closeCancelModal() {
    if (state.saving) {
      return;
    }
    rollbackPendingDashboardCancel();
    elements.cancelModal.hidden = true;
    elements.cancelModalError.textContent = '';
  }

  function rollbackPendingDashboardCancel() {
    if (!state.pendingDashboardCancel) {
      return;
    }
    const pending = state.pendingDashboardCancel;
    const target = state.dashboardRows.find((row) => row.memberId === pending.memberId);
    if (target) {
      target.fields['Membership Status'] = pending.previousStatus;
    } else if (pending.memberSnapshot) {
      pending.memberSnapshot.fields['Membership Status'] = pending.previousStatus;
      state.dashboardRows.push(pending.memberSnapshot);
    }
    if (state.activeView === 'dashboard') {
      renderDashboardTable();
    }
    state.pendingDashboardCancel = null;
  }

  function submitCancelForm(event) {
    event.preventDefault();
    if (!state.selectedMember || state.saving) {
      return;
    }

    const reason = elements.cancelReasonInput.value.trim();
    if (!reason) {
      elements.cancelModalError.textContent = 'Reason is required.';
      elements.cancelReasonInput.focus();
      return;
    }

    state.saving = true;
    updateCancelButtons();
    updateProfileActions();
    setStatus('Canceling membership...');
    removeDashboardMemberRow(state.selectedMember.memberId);

    google.script.run
      .withSuccessHandler((member) => {
        state.saving = false;
        state.selectedMember = member;
        state.dirty = false;
        state.pendingDashboardCancel = null;
        closeCancelModal();
        renderMemberProfile(member);
        updateCancelButtons();
        updateProfileActions();
        clearCachedViewData('cancellations');
        state.cancellationsRows = [];
        loadActiveViewData();
        prefetchCancellations();
        setStatus('Membership canceled.');
      })
      .withFailureHandler((error) => {
        state.saving = false;
        rollbackPendingDashboardCancel();
        updateCancelButtons();
        updateProfileActions();
        elements.cancelModalError.textContent = error && error.message ? error.message : String(error || 'Could not cancel membership.');
        showError(error);
      })
      .cancelMember(state.locationKey, {
        memberId: state.selectedMember.memberId,
        reason: reason,
        solution: elements.cancelSolutionInput.value.trim(),
        cancelDate: elements.cancelDateInput.value
      });
  }

  function removeDashboardMemberRow(memberId) {
    const previousLength = state.dashboardRows.length;
    state.dashboardRows = state.dashboardRows.filter((row) => row.memberId !== memberId);
    if (state.dashboardRows.length !== previousLength && state.activeView === 'dashboard') {
      renderDashboardTable();
    }
  }

  function updateCancelButtons() {
    elements.submitCancelButton.disabled = state.saving;
    elements.cancelCancelButton.disabled = state.saving;
    elements.closeCancelModalButton.disabled = state.saving;
    elements.submitCancelButton.textContent = state.saving ? 'Canceling...' : 'Cancel Membership';
  }

  function closeHoldModal() {
    if (state.holding) {
      return;
    }
    elements.holdModal.hidden = true;
    elements.holdModalError.textContent = '';
  }

  function updateHoldModalFields() {
    const holdType = calculateHoldType(elements.holdStartDateInput.value, elements.holdReturnDateInput.value);
    const isYellowHold = holdType === 'yellow';
    elements.holdEndNurtureField.hidden = true;
    elements.holdCalculatedStatus.textContent = isYellowHold ? 'Yellow Hold' : 'Green Hold';

    if (isYellowHold) {
      elements.holdEndNurtureInput.value = addDaysToInputDate(elements.holdStartDateInput.value, 42);
    } else {
      elements.holdEndNurtureInput.value = '';
    }
    elements.holdNextContactInput.value = getDefaultNextContactDate(elements.holdStartDateInput.value, holdType);
  }

  function submitHoldForm(event) {
    event.preventDefault();
    if (!state.selectedMember || state.holding) {
      return;
    }

    const reason = elements.holdReasonInput.value.trim();
    if (!reason) {
      elements.holdModalError.textContent = 'Reason is required.';
      elements.holdReasonInput.focus();
      return;
    }

    state.holding = true;
    updateHoldButtons();
    updateProfileActions();
    setStatus('Saving hold...');

    google.script.run
      .withSuccessHandler((result) => {
        state.holding = false;
        state.selectedMember = result.member;
        state.dirty = false;
        closeHoldModal();
        renderMemberProfile(result.member);
        updateHoldButtons();
        updateProfileActions();
        loadActiveViewData();
        setStatus(result.upcoming ? 'Upcoming hold saved.' : 'Hold saved.');
      })
      .withFailureHandler((error) => {
        state.holding = false;
        updateHoldButtons();
        updateProfileActions();
        elements.holdModalError.textContent = error && error.message ? error.message : String(error || 'Could not save hold.');
        showError(error);
      })
      .putMemberOnHold(state.locationKey, {
        memberId: state.selectedMember.memberId,
        reason: reason,
        startDate: elements.holdStartDateInput.value,
        nextContact: elements.holdNextContactInput.value,
        returnDate: elements.holdReturnDateInput.value,
        endOfNurture: elements.holdEndNurtureInput.value
      });
  }

  function updateHoldButtons() {
    elements.submitHoldButton.disabled = state.holding;
    elements.cancelHoldButton.disabled = state.holding;
    elements.closeHoldModalButton.disabled = state.holding;
    elements.submitHoldButton.textContent = state.holding ? 'Saving...' : 'Save Hold';
  }

  function calculateHoldType(startDateValue, returnDateValue) {
    if (!returnDateValue) {
      return 'yellow';
    }

    const startDate = parseInputDate(startDateValue);
    const returnDate = parseInputDate(returnDateValue);
    if (!startDate || !returnDate) {
      return 'yellow';
    }

    const days = Math.round((returnDate.getTime() - startDate.getTime()) / 86400000);
    return days >= 28 ? 'yellow' : 'green';
  }

  function getDefaultNextContactDate(startDateValue, holdType) {
    const startDate = parseInputDate(startDateValue) || new Date();
    const nextFriday = getNextFridayOnOrAfter(startDate);
    if (holdType === 'yellow') {
      nextFriday.setDate(nextFriday.getDate() + 7);
    }
    return formatInputDate(nextFriday);
  }

  function getNextFridayOnOrAfter(date) {
    const nextFriday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const daysUntilFriday = (5 - nextFriday.getDay() + 7) % 7;
    nextFriday.setDate(nextFriday.getDate() + daysUntilFriday);
    return nextFriday;
  }

  function addDaysToInputDate(dateValue, days) {
    const date = parseInputDate(dateValue);
    if (!date) {
      return '';
    }
    date.setDate(date.getDate() + days);
    return formatInputDate(date);
  }

  function parseInputDate(value) {
    const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) {
      return null;
    }
    return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
  }

  function formatInputDate(date) {
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${month}-${day}`;
  }

  function getTodayInputValue() {
    const now = new Date();
    return formatInputDate(now);
  }

  function displayDateToInputValue(value) {
    const match = String(value || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!match) {
      return '';
    }
    return `${match[3]}-${String(match[1]).padStart(2, '0')}-${String(match[2]).padStart(2, '0')}`;
  }

  function normalizeBoolean(value) {
    const normalized = String(value || '').trim().toLowerCase();
    return value === true || normalized === 'true' || normalized === 'yes' || normalized === 'y';
  }

  function getSelectedMemberStatus() {
    return String(state.selectedMember && state.selectedMember.fields['Membership Status'] || '').trim().toLowerCase();
  }

  function isSelectedMemberOnHold() {
    const status = getSelectedMemberStatus();
    return status === 'green hold' || status === 'yellow hold';
  }

  function clearSearchResults() {
    elements.searchResults.className = 'list empty-state';
    elements.searchResults.textContent = 'Search for a member to begin.';
  }

  function updateUrlLocation() {
    const url = new URL(window.location.href);
    url.searchParams.set('location', state.locationKey);
    window.history.replaceState({}, '', url.toString());
  }

  function setStatus(message) {
    elements.globalStatus.classList.remove('error');
    elements.globalStatus.textContent = message || '';
  }

  function showError(error) {
    const message = error && error.message ? error.message : String(error || 'Something went wrong.');
    elements.globalStatus.classList.add('error');
    elements.globalStatus.textContent = message;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
